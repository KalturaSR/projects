              <div class="track-label track-label-video" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4V6.5l-4 4z" fill="currentColor"/></svg></div>
              <div class="track-content is-loading"><div class="video-track-content" id="videoTrackContent"><canvas id="videoThumbnails"></canvas><div class="video-track-loaders"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/><path d="M12 2a10 10 0 0 1 10 10" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/><path d="M12 2a10 10 0 0 1 10 10" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/><path d="M12 2a10 10 0 0 1 10 10" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/><path d="M12 2a10 10 0 0 1 10 10" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/><path d="M12 2a10 10 0 0 1 10 10" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/></svg></div></div></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Panel (Form) -->
    <aside class="right-panel" id="rightPanel" aria-label="Properties panel"></aside>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <div class="modal">
      <h2 class="modal-title" id="deleteModalTitle">Delete item?</h2>
      <p class="modal-desc" id="deleteModalDesc">This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="deleteCancelBtn">Keep it</button>
        <button class="btn btn-danger" id="deleteConfirmBtn"><span class="btn-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 4h8M5.5 4V3a1 1 0 011-1h1a1 1 0 011 1v1M4.5 4v7a1 1 0 001 1h3a1 1 0 001-1V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>Delete</button>
      </div>
    </div>
  </div>

  <!-- Preview Overlay -->
  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-badge">Preview Mode</div>
    <button class="preview-close" id="previewCloseBtn">&#10005;</button>
    <div class="preview-chapters" id="previewChapters"></div>
  </div>

  <script>
    // ===== DATA =====

    let data = {
      introduction: {
        title: '',
        text: ''
      },
      chapters: [],
      slides: []
    };

    let selectedItem = null; // { type: 'chapter'|'slide'|'intro', index: number }
    let focusedItem = null; // { type, index } — highlight without opening form
    let timelineSelectMode = 'open'; // always open on timeline click
    let panelViewMode = 'list'; // 'list' = show all items, 'focus' = show only selected item
    let panelFilter = 'chapters'; // 'all' | 'intro' | 'chapters' | 'slides'
    let videoDuration = 0;
    let deleteTarget = null;

    // ===== ZOOM STATE =====
    const ZOOM_STEP_FACTOR = 1.25;
    let pixelsPerSecond = 0;
    let ppsMin = 1;
    let ppsMax = 200;
    let isMouseOverTimeline = false;
    let lastMouseX = 0;
    let thumbnailDebounceTimer = null;

    // ===== VIDEO PLAYER =====
    const video = document.getElementById('videoPlayer');
    video.muted = false;
    video.volume = 1;
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const timestampEl = document.getElementById('timestamp');
    const playheadRuler = document.getElementById('playheadRuler');
    const tracksPlayhead = document.getElementById('tracksPlayhead');

    function formatTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
    }

    function formatTimeHMS(seconds) {
      if (isNaN(seconds)) return '00:00:00';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
    }

    function formatTimeMs(seconds) {
      if (isNaN(seconds)) return '0:00.000';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 1000);
      return m + ':' + s.toString().padStart(2, '0') + '.' + ms.toString().padStart(3, '0');
    }

    playBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', () => {
      const videoArea = document.querySelector('.video-area');
      if (videoArea.classList.contains('slide-main')) {
        videoArea.classList.remove('slide-main');
        if (typeof slideIsMainView !== 'undefined') slideIsMainView = false;
        return;
      }
      togglePlay();
    });

    function togglePlay() {
      if (video.paused) {
        video.muted = false;
        video.volume = 1;
        video.play().catch(() => {});
        playBtn.innerHTML = '&#9646;&#9646;';
      } else {
        video.pause();
        playBtn.innerHTML = '&#9654;';
      }
    }

    video.addEventListener('loadedmetadata', () => {
      videoDuration = video.duration;
      timestampEl.textContent = formatTime(0) + ' / ' + formatTime(videoDuration);
      ppsMin = computePpsMin();
      pixelsPerSecond = ppsMin;
      document.getElementById('zoomSlider').value = 0;
      applyZoom(pixelsPerSecond);
      const loaderText = document.getElementById('loaderText');
      if (loaderText) loaderText.textContent = 'Generating video thumbnails…';
    });

    let rafId = null;
    video.addEventListener('timeupdate', () => {
      if (scrubberDragging) return;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        if (scrubberDragging) return;
        const pct = (video.currentTime / videoDuration) * 100;
        progressFill.style.width = pct + '%';
        updateProgressChapterFills();
        timestampEl.textContent = formatTime(video.currentTime) + ' / ' + formatTime(videoDuration);
        updatePlayhead(pct);
        updatePlayerSlide();
      });
    });

    const progressTooltip = document.getElementById('progressTooltip');

    const chapterIconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="vertical-align:-1px;margin-right:3px;"><path fill-rule="evenodd" clip-rule="evenodd" d="M0 1C0 0.447716 0.447715 0 1 0H11C11.5523 0 12 0.447715 12 1V16C12 16.824 11.0592 17.2944 10.4 16.8L6.6 13.95C6.24444 13.6833 5.75556 13.6833 5.4 13.95L1.6 16.8C0.940764 17.2944 0 16.824 0 16V1Z" fill="currentColor" transform="translate(6,3.5)"/></svg>';

    progressBar.addEventListener('mousemove', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const hoverTime = pct * videoDuration;
      const ch = getChapterAtTime(hoverTime);
      if (ch) {
        progressTooltip.innerHTML = chapterIconSvg + ch.title + '<br>' + formatTime(hoverTime);
      } else {
        progressTooltip.textContent = formatTime(hoverTime);
      }
      progressTooltip.style.left = (pct * 100) + '%';
    });

    progressBar.addEventListener('mouseleave', () => {
      progressTooltip.style.removeProperty('opacity');
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      video.currentTime = pct * videoDuration;
      progressFill.style.width = (pct * 100) + '%';
      updateProgressChapterFills();
      positionPlayhead(pct * 100);
      checkScrubberAssetMatch(pct * videoDuration);
    });

    // Click on time ruler to seek
    document.getElementById('timeRuler').addEventListener('mousedown', (e) => {
      // Don't interfere if clicking the playhead handle itself
      if (e.target === playheadRuler || playheadRuler.contains(e.target)) return;
      seekFromRulerEvent(e);
    });

    function seekFromRulerEvent(e) {
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      video.currentTime = pct * videoDuration;
      positionPlayhead(pct * 100);
      checkScrubberAssetMatch(pct * videoDuration);
    }

    function positionPlayhead(pct) {
      const trackContent = document.getElementById('chapterTrackContent');
      const trackRect = trackContent.getBoundingClientRect();
      const px = (pct / 100) * trackRect.width;

      const ruler = document.getElementById('timeRuler');
      const rulerRect = ruler.getBoundingClientRect();
      const rulerLeft = trackRect.left - rulerRect.left + px;
      playheadRuler.style.left = rulerLeft + 'px';

      const tracks = document.getElementById('timelineTracks');
      const tracksRect = tracks.getBoundingClientRect();
      const tracksLeft = trackRect.left - tracksRect.left + px;
      tracksPlayhead.style.left = tracksLeft + 'px';

      document.getElementById('scrubberTooltip').textContent = getScrubberTooltipText(video.currentTime);
      updatePlayerSlide();
    }

    function updatePlayhead(pct) {
      if (scrubberDragging) return;
      positionPlayhead(pct);
    }

    function updatePlayheadImmediate(pct) {
      positionPlayhead(pct);
    }

    // ===== SCRUBBER SNAP-SELECT =====
    function checkScrubberAssetMatch(time) {
      const threshold = 0.15;
      for (let i = 0; i < data.chapters.length; i++) {
        if (Math.abs(data.chapters[i].time - time) < threshold) {
          if (!selectedItem || selectedItem.type !== 'chapter' || selectedItem.index !== i) {
            focusedItem = { type: 'chapter', index: i };
            selectedItem = null;
            render();
          }
          return;
        }
      }
      for (let i = 0; i < data.slides.length; i++) {
        if (Math.abs(data.slides[i].time - time) < threshold) {
          if (!selectedItem || selectedItem.type !== 'slide' || selectedItem.index !== i) {
            focusedItem = { type: 'slide', index: i };
            selectedItem = null;
            render();
          }
          return;
        }
      }
    }

    // ===== SCRUBBER DRAG =====
    function getChapterAtTime(time) {
      for (let i = data.chapters.length - 1; i >= 0; i--) {
        if (time >= data.chapters[i].time) return data.chapters[i];
      }
      return null;
    }

    function getScrubberTooltipText(time) {
      const ch = getChapterAtTime(time);
      if (ch) return ch.title + '\n' + formatTime(time);
      return formatTime(time);
    }

    let scrubberDragging = false;

    playheadRuler.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      scrubberDragging = true;
      playheadRuler.classList.add('dragging');
      tracksPlayhead.classList.add('dragging');
      document.getElementById('tracksHoverScrubber').style.opacity = '0';
      video.pause();
      playBtn.innerHTML = '&#9654;';
      // Immediately seek to click position
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let newTime = pct * videoDuration;
      const snapped = findSnapTime(newTime, rect.width);
      if (snapped !== null) newTime = snapped;
      video.currentTime = newTime;
      const posPercent = (newTime / videoDuration) * 100;
      positionPlayhead(posPercent);
      document.getElementById('scrubberTooltip').textContent = getScrubberTooltipText(newTime);
      document.addEventListener('mousemove', onScrubberMove);
      document.addEventListener('mouseup', onScrubberUp);
    });

    const SNAP_THRESHOLD_PX = 8;

    function getSnapPoints() {
      const points = [];
      data.chapters.forEach(ch => points.push(ch.time));
      data.slides.forEach(sl => points.push(sl.time));
      return [...new Set(points)].sort((a, b) => a - b);
    }

    function findSnapTime(time, trackWidth) {
      const snapPoints = getSnapPoints();
      const pxPerSec = trackWidth / videoDuration;
      for (const pt of snapPoints) {
        if (Math.abs(pt - time) * pxPerSec < SNAP_THRESHOLD_PX) {
          return pt;
        }
      }
      return null;
    }


    function onScrubberMove(e) {
      if (!scrubberDragging) return;
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let newTime = pct * videoDuration;

      const snappedTime = findSnapTime(newTime, rect.width);
      if (snappedTime !== null) {
        newTime = snappedTime;
      }

      video.currentTime = newTime;
      const actualPct = (newTime / videoDuration) * 100;
      positionPlayhead(actualPct);
      timestampEl.textContent = formatTime(newTime) + ' / ' + formatTime(videoDuration);
      progressFill.style.width = actualPct + '%';
      updateProgressChapterFills();
      document.getElementById('scrubberTooltip').textContent = getScrubberTooltipText(newTime);
      updatePlayerSlide();
    }

    function onScrubberUp(e) {
      scrubberDragging = false;
      playheadRuler.classList.remove('dragging');
      tracksPlayhead.classList.remove('dragging');
      document.removeEventListener('mousemove', onScrubberMove);
      document.removeEventListener('mouseup', onScrubberUp);
      checkScrubberAssetMatch(video.currentTime);
      updatePlayerSlide();
    }

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (video.requestFullscreen) video.requestFullscreen();
    });

    // Click on timeline tracks area to position scrubber
    let lastDragWasMoved = false;
    document.getElementById('timelineTracks').addEventListener('click', (e) => {
      if (lastDragWasMoved) { lastDragWasMoved = false; return; }
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right) return;
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let newTime = pct * videoDuration;
      const snapped = findSnapTime(newTime, rect.width);
      if (snapped !== null) newTime = snapped;

      // Slide empty state: single click moves scrubber and opens file browser
      if (e.target.closest('#emptySlideClick')) {
        video.currentTime = newTime;
        const posPercent = (newTime / videoDuration) * 100;
        positionPlayhead(posPercent);
        positionHoverScrubberAt(e.clientX, rect);
        document.getElementById('slideFileInput').click();
        return;
      }

      // Select clicked segment
      const chapterSeg = e.target.closest('.chapter-segment');
      const slideSeg = e.target.closest('.slide-segment');
      if (chapterSeg) {
        const idx = [...chapterSeg.parentElement.children].filter(c => c.classList.contains('chapter-segment')).indexOf(chapterSeg);
        if (idx >= 0) timelineSelect('chapter', idx, true);
      } else if (slideSeg) {
        const idx = [...slideSeg.parentElement.children].filter(c => c.classList.contains('slide-segment')).indexOf(slideSeg);
        if (idx >= 0) timelineSelect('slide', idx, true);
      }

      video.currentTime = newTime;
      const posPercent = (newTime / videoDuration) * 100;
      positionPlayhead(posPercent);
      positionHoverScrubberAt(e.clientX, rect);
      if (!chapterSeg && !slideSeg) checkScrubberAssetMatch(newTime);
    });

    // ===== HOVER SCRUBBER =====
    const hoverScrubber = document.getElementById('tracksHoverScrubber');
    const hoverTooltip = document.getElementById('hoverScrubberTooltip');
    const timelineScrollableEl = document.getElementById('timelineScrollable');

    function positionHoverScrubberAt(clientX, trackRect) {
      const scrollableRect = timelineScrollableEl.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - trackRect.left) / trackRect.width));
      const leftPx = trackRect.left - scrollableRect.left + pct * trackRect.width;
      hoverScrubber.style.left = leftPx + 'px';
      hoverScrubber.style.opacity = '1';
      hoverTooltip.textContent = formatTime(pct * videoDuration);
    }

    timelineScrollableEl.addEventListener('mousemove', (e) => {
      if (scrubberDragging) {
        hoverScrubber.style.opacity = '0';
        return;
      }
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const scrollableRect = timelineScrollableEl.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right) {
        hoverScrubber.style.opacity = '0';
        return;
      }
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let hoverTime = pct * videoDuration;
      const snapped = findSnapTime(hoverTime, rect.width);
      if (snapped !== null) hoverTime = snapped;
      const snappedPct = hoverTime / videoDuration;
      const leftPx = rect.left - scrollableRect.left + snappedPct * rect.width;
      hoverScrubber.style.left = leftPx + 'px';
      hoverScrubber.style.opacity = '1';
      hoverTooltip.textContent = formatTime(hoverTime);
    });

    timelineScrollableEl.addEventListener('mouseleave', () => {
      hoverScrubber.style.opacity = '0';
    });

    document.getElementById('volumeBtn').addEventListener('click', () => {
      video.muted = !video.muted;
      document.getElementById('volumeBtn').innerHTML = video.muted ? '&#128263;' : '&#128266;';
    });

    // ===== TIME MARKS =====
    const NICE_INTERVALS = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600];

    function pickTickInterval() {
      const targetPx = 100;
      const idealInterval = targetPx / (pixelsPerSecond || 1);
      for (const interval of NICE_INTERVALS) {
        if (interval >= idealInterval * 0.7) return interval;
      }
      return NICE_INTERVALS[NICE_INTERVALS.length - 1];
    }

    function formatTimeMark(seconds) {
      if (seconds >= 3600) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return h + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
      }
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      if (pixelsPerSecond > 80 && seconds < 60) {
        return seconds.toFixed(1) + 's';
      }
      return m + ':' + s.toString().padStart(2, '0');
    }

    function renderTimeMarks() {
      const container = document.getElementById('timeMarks');
      container.innerHTML = '';
      if (!videoDuration || !pixelsPerSecond) return;

      const interval = pickTickInterval();
      const subDivisions = 5;
      const subInterval = interval / subDivisions;

      for (let t = 0; t <= videoDuration + 0.001; t += interval) {
        const x = t * pixelsPerSecond;
        const tick = document.createElement('div');
        tick.className = 'time-tick time-tick-major';
        tick.style.left = x + 'px';
        container.appendChild(tick);

        const label = document.createElement('span');
        label.className = 'time-mark';
        label.style.left = x + 'px';
        label.textContent = formatTimeMark(t);
        container.appendChild(label);

        for (let s = 1; s < subDivisions; s++) {
          const subT = t + s * subInterval;
          if (subT > videoDuration) break;
          const subX = subT * pixelsPerSecond;
          const subTick = document.createElement('div');
          subTick.className = 'time-tick time-tick-minor';
          subTick.style.left = subX + 'px';
          container.appendChild(subTick);
        }
      }

      // Update timeline grid lines
      const tracks = document.getElementById('timelineTracks');
      const gridSpacing = interval * pixelsPerSecond;
      tracks.style.backgroundImage = `repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent ${gridSpacing}px)`;
      tracks.style.backgroundPositionX = '56px';
      tracks.style.backgroundSize = `${gridSpacing}px 100%`;
    }

    // ===== ZOOM ENGINE =====
    function computePpsMin() {
      const timelineArea = document.querySelector('.timeline-area');
      const viewportWidth = timelineArea.clientWidth;
      const usableWidth = viewportWidth - 64 - 24;
      return Math.max(0.5, usableWidth / (videoDuration || 1));
    }

    function sliderToPps(value) {
      const logMin = Math.log(ppsMin);
      const logMax = Math.log(ppsMax);
      return Math.exp(logMin + value * (logMax - logMin));
    }

    function ppsToSlider(pps) {
      const logMin = Math.log(ppsMin);
      const logMax = Math.log(ppsMax);
      return Math.max(0, Math.min(1, (Math.log(pps) - logMin) / (logMax - logMin)));
    }

    function getZoomAnchor() {
      const timelineArea = document.querySelector('.timeline-area');
      const timelineAreaRect = timelineArea.getBoundingClientRect();
      if (isMouseOverTimeline && lastMouseX > 0) {
        const scrollX = timelineArea.scrollLeft;
        const mouseRelToContent = lastMouseX - timelineAreaRect.left + scrollX - 64;
        const time = Math.max(0, Math.min(videoDuration, mouseRelToContent / pixelsPerSecond));
        return { time, screenX: lastMouseX };
      }
      const playheadTime = video.currentTime;
      const pixelPos = playheadTime * pixelsPerSecond + 64;
      const screenX = pixelPos - timelineArea.scrollLeft + timelineAreaRect.left;
      return { time: playheadTime, screenX };
    }

    function applyZoom(newPps, anchorTime, anchorScreenX) {
      const timelineArea = document.querySelector('.timeline-area');
      newPps = Math.max(ppsMin, Math.min(ppsMax, newPps));
      pixelsPerSecond = newPps;

      const totalWidth = videoDuration * pixelsPerSecond;
      const timelineScrollable = document.getElementById('timelineScrollable');
      timelineScrollable.style.width = (totalWidth + 64 + 24) + 'px';
      timelineScrollable.style.minWidth = '100%';

      document.getElementById('zoomSlider').value = ppsToSlider(pixelsPerSecond);

      if (anchorTime !== undefined && anchorScreenX !== undefined) {
        const timelineAreaRect = timelineArea.getBoundingClientRect();
        const pixelPositionOfAnchor = anchorTime * pixelsPerSecond + 64;
        const desiredScrollLeft = pixelPositionOfAnchor - (anchorScreenX - timelineAreaRect.left);
        timelineArea.scrollLeft = Math.max(0, desiredScrollLeft);
      }

      renderTimeMarks();
      render();
      requestAnimationFrame(() => {
        const pct = (video.currentTime / (videoDuration || 1)) * 100;
        positionPlayhead(pct);
      });

      clearTimeout(thumbnailDebounceTimer);
      thumbnailDebounceTimer = setTimeout(generateVideoThumbnails, 250);
    }

    function zoomFit() {
      ppsMin = computePpsMin();
      pixelsPerSecond = ppsMin;
      const timelineArea = document.querySelector('.timeline-area');
      applyZoom(ppsMin);
      timelineArea.scrollLeft = 0;
    }

    function zoomIn(anchorTime, anchorScreenX) {
      applyZoom(pixelsPerSecond * ZOOM_STEP_FACTOR, anchorTime, anchorScreenX);
    }

    function zoomOut(anchorTime, anchorScreenX) {
      applyZoom(pixelsPerSecond / ZOOM_STEP_FACTOR, anchorTime, anchorScreenX);
    }

    function zoomToTimeRange(startTime, endTime) {
      const timelineArea = document.querySelector('.timeline-area');
      const viewportWidth = timelineArea.clientWidth;
      const usableWidth = viewportWidth - 64 - 24;
      const duration = Math.max(0.5, endTime - startTime);
      const targetPps = (usableWidth * 0.7) / duration;
      const clampedPps = Math.max(ppsMin, Math.min(ppsMax, targetPps));
      const midTime = (startTime + endTime) / 2;
      const centerScreenX = timelineArea.getBoundingClientRect().left + viewportWidth / 2;
      applyZoom(clampedPps, midTime, centerScreenX);
    }

    // Zoom event handlers
    document.getElementById('zoomFitBtn').addEventListener('click', zoomFit);

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      const anchor = getZoomAnchor();
      zoomIn(anchor.time, anchor.screenX);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      const anchor = getZoomAnchor();
      zoomOut(anchor.time, anchor.screenX);
    });

    document.getElementById('zoomSlider').addEventListener('input', (e) => {
      const anchor = getZoomAnchor();
      const newPps = sliderToPps(parseFloat(e.target.value));
      applyZoom(newPps, anchor.time, anchor.screenX);
    });

    // Ctrl/Cmd + Mouse Wheel zoom
    const timelineAreaEl = document.querySelector('.timeline-area');
    timelineAreaEl.addEventListener('mouseenter', () => { isMouseOverTimeline = true; });
    timelineAreaEl.addEventListener('mouseleave', () => { isMouseOverTimeline = false; });
    timelineAreaEl.addEventListener('mousemove', (e) => { lastMouseX = e.clientX; });
    timelineAreaEl.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = Math.pow(1.005, -e.deltaY);
        const anchor = getZoomAnchor();
        applyZoom(pixelsPerSecond * factor, anchor.time, anchor.screenX);
      }
    }, { passive: false });

    // ===== RENDER =====
    let appReady = false;

    function render() {
      if (!appReady) return;
      renderChapterTrack();
      renderSlideTrack();
      renderPanel();
      renderProgressSplits();
      updatePlayerSlide();
      const isEmpty = data.chapters.length === 0 && data.slides.length === 0;
    }

    function renderProgressSplits() {
      const bar = document.getElementById('progressBar');
      bar.querySelectorAll('.progress-chapter-seg').forEach(el => el.remove());
      if (videoDuration <= 0 || data.chapters.length <= 1) {
        bar.classList.remove('has-chapters');
        return;
      }
      bar.classList.add('has-chapters');
      for (let i = 0; i < data.chapters.length; i++) {
        const startTime = data.chapters[i].time;
        const endTime = i < data.chapters.length - 1 ? data.chapters[i + 1].time : videoDuration;
        const widthPct = ((endTime - startTime) / videoDuration) * 100;
        const seg = document.createElement('div');
        seg.className = 'progress-chapter-seg';
        seg.style.flex = '0 0 ' + widthPct + '%';
        seg.dataset.start = startTime;
        seg.dataset.end = endTime;
        seg.innerHTML = '<div class="progress-chapter-seg-fill"></div>';
        bar.appendChild(seg);
      }
      updateProgressChapterFills();
    }

    function updateProgressChapterFills() {
      const bar = document.getElementById('progressBar');
      if (!bar.classList.contains('has-chapters')) return;
      const currentTime = video.currentTime || 0;
      bar.querySelectorAll('.progress-chapter-seg').forEach(seg => {
        const start = parseFloat(seg.dataset.start);
        const end = parseFloat(seg.dataset.end);
        const fill = seg.querySelector('.progress-chapter-seg-fill');
        if (currentTime >= end) {
          fill.style.width = '100%';
        } else if (currentTime <= start) {
          fill.style.width = '0%';
        } else {
          const pct = ((currentTime - start) / (end - start)) * 100;
          fill.style.width = pct + '%';
        }
      });
    }

    function renderChapterTrack() {
      const container = document.getElementById('chapterTrackContent');
      container.innerHTML = '';

      container.setAttribute('aria-label', 'Chapter segments');

      data.chapters.forEach((ch, i) => {
        if (i === 0 && ch.time !== 0) { ch.time = 0; }
        const nextTime = (i < data.chapters.length - 1) ? data.chapters[i + 1].time : videoDuration;
        const duration = nextTime - ch.time;
        const widthPx = duration * pixelsPerSecond;
        const el = document.createElement('div');
        el.className = 'chapter-segment' + ((selectedItem && selectedItem.type === 'chapter' && selectedItem.index === i) || (focusedItem && focusedItem.type === 'chapter' && focusedItem.index === i) ? ' active' : '');

        el.innerHTML = handles + '<span class="segment-text"><span class="segment-time-row">' + formatTime(ch.time) + ' - ' + formatTime(endTime) + '</span><span class="segment-title-row">' + ch.title + '</span></span>';

        el.setAttribute('data-tooltip', 'Chapter: ' + ch.title);
        el.setAttribute('role', 'listitem');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', 'Chapter: ' + ch.title + ' at ' + formatTime(ch.time));
        el.setAttribute('aria-roledescription', 'resizable chapter');

          if (e.target.classList.contains('resize-handle')) {
            initResize(e, 'chapter', i, e.target.dataset.side);

          e.stopPropagation();

          zoomToTimeRange(startT, endT);

          e.preventDefault();

          showTimelineContextMenu(e.clientX, e.clientY, 'chapter', i);

          if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); timelineSelect('chapter', i); }

        container.appendChild(el);

    function parseTime(str) {
      const parts = str.trim().split(':');
      if (parts.length === 2) {
        const m = parseInt(parts[0]) || 0;
        const s = parseInt(parts[1]) || 0;
        return m * 60 + s;
      }
      if (parts.length === 3) {
        const h = parseInt(parts[0]) || 0;
        const m = parseInt(parts[1]) || 0;
        const s = parseInt(parts[2]) || 0;
        return h * 3600 + m * 60 + s;
      }
      return null;
    }

        data.introduction.text = '';

    function bindPanelEvents() {
      const clearChBtn = document.getElementById('clearAllChaptersBtn');

      const clearSlBtn = document.getElementById('clearAllSlidesBtn');
      if (clearSlBtn) clearSlBtn.addEventListener('click', () => showClearAllModal('slides'));

      const modeToggle = document.getElementById('modeToggle');
      if (modeToggle) {
        modeToggle.addEventListener('click', () => {
          panelViewMode = panelViewMode === 'list' ? 'focus' : 'list';
          if (focusedItem && !selectedItem) {
            selectedItem = { ...focusedItem };
            focusedItem = null;
          }
          renderPanel();
        });
      }

      document.querySelectorAll('.use-current-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = btn.closest('.accordion-item');
          if (item) {
            const type = item.dataset.type;
            const index = parseInt(item.dataset.index);
            selectedItem = { type, index };
          }
          useCurrentTime();
        });
      });

      document.querySelectorAll('.accordion-delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = btn.closest('.accordion-item');
          if (item) {
            const type = item.dataset.type;
            const index = parseInt(item.dataset.index);
            selectedItem = { type, index };
          }
          confirmDelete();
        });
      });

      // Form inputs
      const introText = document.getElementById('introTextInput');
      if (introText) introText.addEventListener('input', (e) => { data.introduction.text = e.target.value; triggerSave(); });

      const chTitle = document.getElementById('chapterTitleInput');
      if (chTitle) {
        chTitle.addEventListener('input', (e) => {
          if (e.target.value.trim()) {
            data.chapters[selectedItem.index].title = e.target.value;
            renderChapterTrack();
            triggerSave();
          }
        });
        chTitle.addEventListener('blur', (e) => {
          if (!e.target.value.trim()) e.target.value = data.chapters[selectedItem.index].title;
        });
      }

      const chSummary = document.getElementById('chapterSummaryInput');
      if (chSummary) chSummary.addEventListener('input', (e) => { data.chapters[selectedItem.index].summary = e.target.value; triggerSave(); });

      // Chapter timestamp auto-save
      const chTime = document.getElementById('chapterTimeInput');
      if (chTime) chTime.addEventListener('change', (e) => {
        const seconds = parseTime(e.target.value);
        if (seconds !== null && seconds >= 0 && seconds <= videoDuration) {
          data.chapters[selectedItem.index].time = seconds;
          data.chapters.sort((a, b) => a.time - b.time);
          const item = data.chapters.find(c => c.time === seconds);
          selectedItem.index = data.chapters.indexOf(item);
          video.currentTime = seconds;
          render();
          triggerSave();
        } else {
          e.target.value = formatTime(data.chapters[selectedItem.index].time);
        }
      });

      const slTitle = document.getElementById('slideTitleInput');
      if (slTitle) {
        slTitle.addEventListener('input', (e) => {
          if (e.target.value.trim()) {
            data.slides[selectedItem.index].title = e.target.value;
            renderSlideTrack();
            triggerSave();
          }
        });
        slTitle.addEventListener('blur', (e) => {
          if (!e.target.value.trim()) e.target.value = data.slides[selectedItem.index].title;
        });
      }

      const slDesc = document.getElementById('slideDescInput');
      if (slDesc) slDesc.addEventListener('input', (e) => { data.slides[selectedItem.index].description = e.target.value; triggerSave(); });

      // Slide timestamp auto-save
      const slTime = document.getElementById('slideTimeInput');
      if (slTime) slTime.addEventListener('change', (e) => {
        const seconds = parseTime(e.target.value);
        if (seconds !== null && seconds >= 0 && seconds <= videoDuration) {
          data.slides[selectedItem.index].time = seconds;
          data.slides.sort((a, b) => a.time - b.time);
          const item = data.slides.find(s => s.time === seconds);
          selectedItem.index = data.slides.indexOf(item);
          video.currentTime = seconds;
          render();
          triggerSave();
        } else {
          e.target.value = formatTime(data.slides[selectedItem.index].time);
        }
      });

      // Accordion row clicks — select item; chevron toggles expand/collapse
      document.querySelectorAll('.accordion-item > .accordion-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('input, textarea, button')) return;
          const item = row.parentElement;
          const type = item.dataset.type;
          const index = parseInt(item.dataset.index);
          if (e.target.closest('.accordion-row-chevron')) {
            const alreadyExpanded = selectedItem && selectedItem.type === type && selectedItem.index === index;
            if (alreadyExpanded) {
              selectedItem = null;
              focusedItem = { type, index };
              render();
            } else {
              selectItem(type, index);
            }
          } else {
            selectItem(type, index);
          }
        });
      });
    }

    // ===== SELECTION =====
    function timelineSelect(type, index, skipSeek) {
      selectItem(type, index, skipSeek);
    }

    function focusItem(type, index) {
      focusedItem = { type, index };
      selectedItem = null;
      if (type === 'chapter') {
        panelFilter = 'chapters';
      } else if (type === 'slide') {
        panelFilter = 'slides';
      }
      updateSidebarActive();
      render();
      if (type === 'chapter' && data.chapters[index]) {
        video.currentTime = data.chapters[index].time;
      } else if (type === 'slide' && data.slides[index]) {
        video.currentTime = data.slides[index].time;
      }
      updatePlayerSlide();
      const focusedEl = document.querySelector('.accordion-item.focused');
      if (focusedEl) {
        focusedEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function selectItem(type, index, skipSeek) {
      selectedItem = { type, index };
      focusedItem = null;
      // Always switch panel filter to show the selected item's type
      if (type === 'intro') {
        panelFilter = 'intro';
      } else if (type === 'chapter') {
        panelFilter = 'chapters';
      } else if (type === 'slide') {
        panelFilter = 'slides';
      }
      updateSidebarActive();
      render();
      if (!skipSeek) {
        if (type === 'chapter' && data.chapters[index]) {
          video.currentTime = data.chapters[index].time;
        } else if (type === 'slide' && data.slides[index]) {
          video.currentTime = data.slides[index].time;
        }
        updatePlayerSlide();
      }
      // Scroll the expanded item into view in the panel
      const expandedEl = document.querySelector('.accordion-item.expanded');
      if (expandedEl) {
        expandedEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function updateSidebarActive() {
      document.querySelectorAll('.panel-tab').forEach(b => {
        b.classList.toggle('active', b.dataset.panel === panelFilter);
      });
    }

    // ===== ADD CHAPTER =====
    function findAvailableTime(requestedTime, existingTimes) {
      const time = Math.round(requestedTime * 10) / 10;
      const tooClose = existingTimes.some(t => Math.abs(t - time) < 0.5);
      if (!tooClose) return time;
      const maxTime = videoDuration;
      for (let offset = 1; offset <= Math.ceil(maxTime); offset++) {
        const forward = Math.round((time + offset) * 10) / 10;
        if (forward <= maxTime && !existingTimes.some(t => Math.abs(t - forward) < 0.5)) return forward;
      }
      return null;
    }

    function addChapter() {
      let time;
      if (data.chapters.length === 0) {
        time = 0;
      } else {
        time = video.currentTime || 0;
        const existingChapterTimes = data.chapters.map(c => c.time);
        const rounded = Math.round(time * 10) / 10;
        const tooClose = existingChapterTimes.some(t => Math.abs(t - rounded) < 0.5);

        if (!tooClose) {
          time = rounded;
        } else {
          // Snap to slide positions on the other timeline first
          let placed = false;
          if (data.slides.length > 0) {
            const sortedSlides = [...data.slides].sort((a, b) => a.time - b.time);
            for (const slide of sortedSlides) {
              const sTime = Math.round(slide.time * 10) / 10;
              if (sTime >= rounded && !existingChapterTimes.some(t => Math.abs(t - sTime) < 0.5)) {
                time = sTime;
                placed = true;
                break;
              }
            }
          }
          // Then try 2s gaps forward from current time
          if (!placed) {
            let candidate = rounded;
            while (candidate <= videoDuration) {
              candidate = Math.round((candidate + 2) * 10) / 10;
              if (candidate <= videoDuration && !existingChapterTimes.some(t => Math.abs(t - candidate) < 0.5)) {
                time = candidate;
                placed = true;
                break;
              }
            }
          }
          if (!placed) {
            showToast('No more room — timeline is full');
            return;
          }
        }
      }
      const newChapter = { time, title: 'Untitled chapter', summary: '', ai: false };
      data.chapters.push(newChapter);
      data.chapters.sort((a, b) => a.time - b.time);
      const newIndex = data.chapters.indexOf(newChapter);
      selectedItem = { type: 'chapter', index: newIndex };
      panelFilter = 'chapters';
      updateSidebarActive();
      render();
      triggerSave();
      showToast('Chapter added at ' + formatTime(time));

    // ===== ADD SLIDES (PDF upload from desktop) =====
    async function handlePdfUpload(file, startTime) {
      if (typeof pdfjsLib === 'undefined') {
        showToast('PDF library loading, please try again...');
        return;
      }
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;
        const dur = videoDuration || 1;
        const rangeStart = (startTime !== undefined) ? startTime : video.currentTime;
        const availableRange = dur - rangeStart;
        const slideDuration = availableRange / totalPages;
        const deckName = file.name.replace(/\.[^.]+$/, '');

        showToast('Extracting ' + totalPages + ' slides from PDF...');

        for (let p = 1; p <= totalPages; p++) {
          const page = await pdf.getPage(p);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          const image = canvas.toDataURL('image/png');
          const time = rangeStart + (p - 1) * slideDuration;
          const textContent = await page.getTextContent();
          const lines = [];
          let currentLine = '';
          for (const item of textContent.items) {
            if (item.hasEOL && currentLine) { lines.push(currentLine.trim()); currentLine = ''; }
            currentLine += item.str;
          }
          if (currentLine.trim()) lines.push(currentLine.trim());
          const title = lines[0] || ('Slide ' + p + ' - ' + deckName);
          const description = lines.slice(1).join('\n');
          data.slides.push({ time, title, description, image });
        }

        data.slides.sort((a, b) => a.time - b.time);
        selectedItem = { type: 'slide', index: 0 };
        panelFilter = 'slides';
        updateSidebarActive();
        render();
        triggerSave();
        showToast(totalPages + ' slides added from ' + file.name);
      } catch (err) {
        showToast('Error reading PDF: ' + err.message);
      }
    }

    async function handlePptxUpload(file, startTime) {
      if (typeof JSZip === 'undefined') {
        showToast('PPTX library loading, please try again...');
        return;
      }
      try {
        const arrayBuffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);

        // Find slide image thumbnails in ppt/media/
        const mediaFiles = [];
        zip.forEach((path, entry) => {
          if (path.match(/^ppt\/media\/image\d+\.(png|jpg|jpeg|gif|webp)$/i)) {
            mediaFiles.push({ path, entry });
          }
        });

        // Find slides to count them
        const slideFiles = [];
        zip.forEach((path, entry) => {
          if (path.match(/^ppt\/slides\/slide\d+\.xml$/i)) {
            slideFiles.push(path);
          }
        });
        slideFiles.sort((a, b) => {
          const numA = parseInt(a.match(/slide(\d+)/)[1]);
          const numB = parseInt(b.match(/slide(\d+)/)[1]);
          return numA - numB;
        });

        const totalSlides = slideFiles.length;
        if (totalSlides === 0) {
          showToast('No slides found in PPTX file');
          return;
        }

        const dur = videoDuration || 1;
        const rangeStart = (startTime !== undefined) ? startTime : video.currentTime;
        const availableRange = dur - rangeStart;
        const slideDuration = availableRange / totalSlides;
        const deckName = file.name.replace(/\.[^.]+$/, '');

        showToast('Extracting ' + totalSlides + ' slides from PPTX...');

        // Extract text from slide XMLs
        const slideTexts = [];
        for (const slidePath of slideFiles) {
          const xmlStr = await zip.file(slidePath).async('string');
          const parser = new DOMParser();
          const doc = parser.parseFromString(xmlStr, 'application/xml');
          const textNodes = doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/main', 't');
          const paragraphs = doc.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/main', 'p');
          const lines = [];
          let currentLine = '';
          for (const p of paragraphs) {
            const tNodes = p.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/main', 't');
            let pText = '';
            for (const t of tNodes) { pText += t.textContent; }
            if (pText.trim()) lines.push(pText.trim());
          }
          slideTexts.push(lines);
        }

        // Extract images sorted by name
        mediaFiles.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));

        for (let i = 0; i < totalSlides; i++) {
          let image = '';
          if (i < mediaFiles.length) {
            const blob = await mediaFiles[i].entry.async('blob');
            image = await new Promise(resolve => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.readAsDataURL(blob);
            });
          }
          const time = rangeStart + i * slideDuration;
          const lines = slideTexts[i] || [];
          const title = lines[0] || ('Slide ' + (i + 1) + ' - ' + deckName);
          const description = lines.slice(1).join('\n');
          data.slides.push({ time, title, description, image });
        }

        data.slides.sort((a, b) => a.time - b.time);
        selectedItem = { type: 'slide', index: 0 };
        panelFilter = 'slides';
        updateSidebarActive();
        render();
        triggerSave();
        showToast(totalSlides + ' slides added from ' + file.name);
      } catch (err) {
        showToast('Error reading PPTX: ' + err.message);
      }
    }

    // ===== UNDO/REDO =====
    const history = [];
    let historyIndex = -1;
    const MAX_HISTORY = 50;

    function pushHistory() {
      const snapshot = JSON.stringify({ data, selectedItem });
      if (historyIndex >= 0 && history[historyIndex] === snapshot) return;
      history.splice(historyIndex + 1);
      history.push(snapshot);
      if (history.length > MAX_HISTORY) history.shift();
      historyIndex = history.length - 1;
    }

    function undo() {
      if (historyIndex <= 0) { showToast('Nothing to undo'); return; }
      historyIndex--;
      restoreSnapshot(history[historyIndex]);
      showToast('Undo');
    }

    function redo() {
      if (historyIndex >= history.length - 1) { showToast('Nothing to redo'); return; }
      historyIndex++;
      restoreSnapshot(history[historyIndex]);
      showToast('Redo');
    }

    function restoreSnapshot(snapshot) {
      const state = JSON.parse(snapshot);
      data = state.data;
      selectedItem = state.selectedItem;
      render();
      triggerSaveUI();
    }

    // ===== KEYBOARD =====
    document.addEventListener('keydown', (e) => {
      // Undo/Redo works everywhere
      if ((e.metaKey || e.ctrlKey) && e.code === 'KeyZ') {
        e.preventDefault();
        if (e.shiftKey) { redo(); } else { undo(); }
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.code === 'KeyY') {
        e.preventDefault();
        redo();
        return;
      }

      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      // Keyboard reorder of selected segment (swap with neighbor, preserve durations)
      if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && selectedItem
          && (selectedItem.type === 'chapter' || selectedItem.type === 'slide')
          && document.activeElement
          && (document.activeElement.classList.contains('chapter-segment') || document.activeElement.classList.contains('slide-segment'))) {
        e.preventDefault();
        const direction = e.code === 'ArrowLeft' ? -1 : 1;
        const arr = selectedItem.type === 'chapter' ? data.chapters : data.slides;
        const idx = selectedItem.index;
        const swapIdx = idx + direction;
        if (swapIdx < 0 || swapIdx >= arr.length) return;

        pushHistory();
        const durations = getSegmentDurations(selectedItem.type);
        // Swap item and duration
        [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
        [durations[idx], durations[swapIdx]] = [durations[swapIdx], durations[idx]];
        rebuildTimesFromDurations(selectedItem.type, durations);

        selectedItem.index = swapIdx;
        render();
        triggerSaveUI();
        announce((selectedItem.type === 'chapter' ? 'Chapter' : 'Slide') + ' moved to position ' + (swapIdx + 1));
        const segments = document.querySelectorAll('.' + selectedItem.type + '-segment');
        if (segments[swapIdx]) segments[swapIdx].focus();
        return;
      }

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
      if (e.code === 'ArrowLeft') {
        video.currentTime = Math.max(0, video.currentTime - 5);
      }
      if (e.code === 'ArrowRight') {
        video.currentTime = Math.min(videoDuration, video.currentTime + 5);
      }
      if (e.code === 'Delete' || e.code === 'Backspace') {
        if (selectedItem && (selectedItem.type === 'chapter' || selectedItem.type === 'slide')) {
          confirmDelete();
        }
      }
      if (e.code === 'Escape') {
        document.getElementById('deleteModal').classList.remove('visible');
        document.getElementById('previewOverlay').classList.remove('visible');
      }
      if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        const anchor = getZoomAnchor();
        zoomIn(anchor.time, anchor.screenX);
      }
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        const anchor = getZoomAnchor();
        zoomOut(anchor.time, anchor.screenX);
      }
      if (e.key === '0') {
        e.preventDefault();
        zoomFit();
      }
    });
