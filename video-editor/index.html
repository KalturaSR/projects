      const container = document.getElementById('videoTrackContent');
      const containerWidth = Math.max(200, container.offsetWidth);
      const thumbCellWidth = 80;
      const thumbCount = Math.min(30, Math.max(5, Math.ceil(containerWidth / thumbCellWidth)));
      const thumbWidth = Math.ceil(containerWidth / thumbCount);
      const thumbHeight = 40;

      canvas.width = containerWidth;
      canvas.height = thumbHeight;

      // Create a dedicated offscreen video for thumbnail extraction
      const thumbVideo = document.createElement('video');
      thumbVideo.muted = true;
      thumbVideo.preload = 'auto';
      thumbVideo.playsInline = true;
      // Use the same source as main video, no crossOrigin for local files
      thumbVideo.src = document.querySelector('#videoPlayer source').src;

      let captured = 0;

      thumbVideo.addEventListener('loadeddata', () => {
        seekNext();
      });

      function seekNext() {
        if (captured >= thumbCount) {
          thumbVideo.remove();
          container.classList.add('loaded');
          if (!thumbnailsReady) {
            thumbnailsReady = true;
            const loaderText = document.getElementById('loaderText');
            if (loaderText) loaderText.textContent = 'Preparing editor…';
            checkAllReady();
          }
          return;
        }
        const t = (videoDuration / thumbCount) * captured + 0.1;
        thumbVideo.currentTime = Math.min(t, videoDuration - 0.5);
      }

      thumbVideo.addEventListener('seeked', () => {
        try {
          const x = captured * thumbWidth;
          ctx.drawImage(thumbVideo, x, 0, thumbWidth, thumbHeight);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(x, 0, 1, thumbHeight);
        } catch (e) {
          // If drawImage fails due to security, draw colored placeholder
          const x = captured * thumbWidth;
          const hue = (captured / thumbCount) * 40 + 200;
          ctx.fillStyle = `hsl(${hue}, 30%, ${15 + (captured % 2) * 5}%)`;
          ctx.fillRect(x, 0, thumbWidth, thumbHeight);
        }
        captured++;
        seekNext();
      });
    }

    // ===== DRAG & DROP (reorder — preserves duration) =====
    let dragState = null;

    function getSegmentDurations(type) {
      const arr = type === 'chapter' ? data.chapters : data.slides;
      const dur = videoDuration || 1;
      return arr.map((item, i) => {
        const nextTime = (i < arr.length - 1) ? arr[i + 1].time : dur;
        return nextTime - item.time;
      });
    }

    function rebuildTimesFromDurations(type, durations) {
      const arr = type === 'chapter' ? data.chapters : data.slides;
      let t = 0;
      for (let i = 0; i < arr.length; i++) {
        arr[i].time = t;
        t += durations[i];
      }
    }

    function initDrag(e, type, index) {
      if (e.button !== 0) return;
      e.preventDefault();

      const trackContent = type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const timelineArea = document.querySelector('.timeline-area');

      const durations = getSegmentDurations(type);

      dragState = {
        type,
        index,
        trackRect: rect,
        startX: e.clientX,
        moved: false,
        indicator: null,
        indicatorLabel: null,
        scrollLeft: timelineArea.scrollLeft,
        lastClientX: e.clientX,
        lastClientY: e.clientY,
        element: e.currentTarget,
        autoScrollRAF: null,
        originalDurations: durations,
        targetInsertIdx: index
      };

      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
    }

    // -- Ghost thumbnail --
    function createDragGhost(segmentEl) {
      const ghost = document.getElementById('dragGhost');
      // Clone content without resize handles
      const clone = segmentEl.cloneNode(true);
      clone.querySelectorAll('.resize-handle').forEach(h => h.remove());
      ghost.innerHTML = clone.innerHTML;
      ghost.style.width = Math.min(200, segmentEl.offsetWidth) + 'px';
      ghost.style.height = segmentEl.offsetHeight + 'px';
      ghost.style.background = getComputedStyle(segmentEl).background;
      ghost.classList.add('visible');
    }

    function updateGhostPosition(clientX, clientY) {
      const ghost = document.getElementById('dragGhost');
      ghost.style.left = (clientX - ghost.offsetWidth / 2) + 'px';
      ghost.style.top = (clientY - ghost.offsetHeight - 16) + 'px';
    }

    function removeDragGhost() {
      const ghost = document.getElementById('dragGhost');
      ghost.classList.remove('visible');
      setTimeout(() => { ghost.innerHTML = ''; }, 150);
    }

    // -- Snap logic --
    function getSnapTargets(type) {
      const targets = [0, videoDuration, video.currentTime];
      data.chapters.forEach((ch, i) => {
        if (type === 'chapter' && i === dragState.index) return;
        targets.push(ch.time);
      });
      data.slides.forEach((sl, i) => {
        if (type === 'slide' && i === dragState.index) return;
        targets.push(sl.time);
      });
      return targets;
    }

    function applySnap(rawTime, targets) {
      const threshold = 10 / pixelsPerSecond;
      let closest = null;
      let closestDist = Infinity;
      for (let i = 0; i < targets.length; i++) {
        const dist = Math.abs(rawTime - targets[i]);
        if (dist < threshold && dist < closestDist) {
          closest = targets[i];
          closestDist = dist;
        }
      }
      return closest !== null ? { time: closest, snapped: true } : { time: rawTime, snapped: false };
    }

    function showSnapLine(timePx) {
      const snapLine = document.getElementById('snapLine');
      snapLine.style.left = timePx + 'px';
      snapLine.classList.add('active');
    }

    function hideSnapLine() {
      document.getElementById('snapLine').classList.remove('active');
    }

    // -- Auto-scroll --
    function startAutoScroll() {
      if (dragState.autoScrollRAF) return;
      autoScrollFrame();
    }

    function autoScrollFrame() {
      if (!dragState || !dragState.moved) return;
      const timelineArea = document.querySelector('.timeline-area');
      const areaRect = timelineArea.getBoundingClientRect();
      const cursorX = dragState.lastClientX;
      const edgeZone = 60;

      let scrollDelta = 0;
      if (cursorX < areaRect.left + edgeZone) {
        scrollDelta = -((areaRect.left + edgeZone - cursorX) / edgeZone) * 8;
      } else if (cursorX > areaRect.right - edgeZone) {
        scrollDelta = ((cursorX - (areaRect.right - edgeZone)) / edgeZone) * 8;
      }

      if (scrollDelta !== 0) {
        timelineArea.scrollLeft += scrollDelta;
        updateDragPosition(dragState.lastClientX);
      }

      dragState.autoScrollRAF = requestAnimationFrame(autoScrollFrame);
    }

    function stopAutoScroll() {
      if (dragState && dragState.autoScrollRAF) {
        cancelAnimationFrame(dragState.autoScrollRAF);
        dragState.autoScrollRAF = null;
      }
    }

    // -- Core position update (used by both mousemove and auto-scroll) --
    function updateDragPosition(clientX) {
      if (!dragState || !dragState.moved) return;

      const trackContent = dragState.type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();
      dragState.trackRect = rect;

      const relX = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const cursorTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

      // Determine target insertion index based on cursor position over segments
      const arr = dragState.type === 'chapter' ? data.chapters : data.slides;
      const durations = dragState.originalDurations;
      let targetIdx = 0;

      // Walk through segment boundaries (excluding dragged) to find where cursor lands
      let accTime = 0;
      let otherIdx = 0;
      for (let i = 0; i < arr.length; i++) {
        if (i === dragState.index) continue;
        const segEnd = accTime + durations[i];
        const midpoint = accTime + durations[i] / 2;
        if (cursorTime > midpoint) {
          targetIdx = otherIdx + 1;
        }
        accTime = segEnd;
        otherIdx++;
      }
      dragState.targetInsertIdx = targetIdx;

      // Calculate the pixel position of the insertion point
      let insertPx = 0;
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (i === dragState.index) continue;
        if (count === targetIdx) break;
        insertPx += durations[i] * pixelsPerSecond;
        count++;
      }

      // Snap indicator
      const snapTargets = getSnapTargets(dragState.type);
      const snapResult = applySnap(cursorTime, snapTargets);
      if (snapResult.snapped) {
        showSnapLine(snapResult.time * pixelsPerSecond);
      } else {
        hideSnapLine();
      }

      // Apply gap classes to segments
      const draggedWidth = dragState.originalDurations[dragState.index] * pixelsPerSecond;
      const segments = trackContent.querySelectorAll('.' + dragState.type + '-segment');
      segments.forEach((seg, i) => {
        seg.classList.toggle('dragging', i === dragState.index);
        seg.classList.remove('gap-before', 'gap-after');
        seg.style.marginLeft = '';
        seg.style.marginRight = '';
      });

      // Open gap at insertion point equal to dragged segment width
      let segCount = 0;
      for (let i = 0; i < segments.length; i++) {
        if (i === dragState.index) continue;
        if (segCount === targetIdx - 1 && targetIdx > 0) {
          segments[i].classList.add('gap-after');
          segments[i].style.marginRight = draggedWidth + 'px';
        } else if (segCount === targetIdx && targetIdx === 0) {
          segments[i].classList.add('gap-before');
          segments[i].style.marginLeft = draggedWidth + 'px';
        }
        segCount++;
      }

      // Position ghost placeholder in the gap — clamp within timeline bounds
      const maxPx = videoDuration * pixelsPerSecond;
      const clampedInsertPx = Math.max(0, Math.min(insertPx, maxPx - draggedWidth));
      const clampedWidth = Math.min(draggedWidth, maxPx - clampedInsertPx);

      if (!dragState.indicator) {
        dragState.indicator = document.createElement('div');
        dragState.indicator.className = 'drag-ghost-placeholder';
        const content = document.createElement('div');
        content.className = 'drag-ghost-placeholder-content';
        dragState.indicator.appendChild(content);
        trackContent.appendChild(dragState.indicator);
      }
      dragState.indicator.style.left = clampedInsertPx + 'px';
      dragState.indicator.style.width = clampedWidth + 'px';
      const insertTime = clampedInsertPx / pixelsPerSecond;
      const segName = (dragState.type === 'chapter' ? data.chapters : data.slides)[dragState.index].title;
      dragState.indicator.querySelector('.drag-ghost-placeholder-content').textContent = formatTime(insertTime) + ' · ' + segName;
    }

    function onDragMove(e) {
      if (!dragState) return;

      const dx = Math.abs(e.clientX - dragState.startX);
      if (dx < 10 && !dragState.moved) return;

      if (!dragState.moved) {
        dragState.moved = true;
        document.body.classList.add('is-dragging');
        pushHistory();
        createDragGhost(dragState.element);
        announce('Dragging ' + dragState.type + '. Drop to reposition.');

        const track = dragState.type === 'chapter'
          ? document.getElementById('chapterTrack')
          : document.getElementById('slideTrack');
        track.classList.add('drop-target-active');

        // Collapse the dragged segment visually
        const segments = track.querySelectorAll('.' + dragState.type + '-segment');
        if (segments[dragState.index]) {
          segments[dragState.index].classList.add('dragging');
        }

        startAutoScroll();
      }

      dragState.lastClientX = e.clientX;
      dragState.lastClientY = e.clientY;

      updateGhostPosition(e.clientX, e.clientY);
      updateDragPosition(e.clientX);
    }

    function onDragEnd(e) {
      if (!dragState) return;

      document.body.classList.remove('is-dragging');
      stopAutoScroll();
      removeDragGhost();
      hideSnapLine();

      if (dragState.indicator) {
        dragState.indicator.remove();
      }

      // Clean up gap margins
      document.querySelectorAll('.gap-before, .gap-after').forEach(seg => {
        seg.classList.remove('gap-before', 'gap-after');
        seg.style.marginLeft = '';
        seg.style.marginRight = '';
      });

      document.querySelectorAll('.track').forEach(t => t.classList.remove('drop-target-active'));

      if (!dragState.moved) {
        // Select asset in panel
        timelineSelect(dragState.type, dragState.index, true);
        // Move both scrubbers to mouse click position
        const clickTrackContent = document.getElementById('chapterTrackContent');
        const clickRect = clickTrackContent.getBoundingClientRect();
        const clickPct = Math.max(0, Math.min(1, (dragState.lastClientX - clickRect.left) / clickRect.width));
        let clickTime = clickPct * videoDuration;
        const clickSnapped = findSnapTime(clickTime, clickRect.width);
        if (clickSnapped !== null) clickTime = clickSnapped;
        video.currentTime = clickTime;
        const clickPosPercent = (clickTime / videoDuration) * 100;
        positionPlayhead(clickPosPercent);
        positionHoverScrubberAt(dragState.lastClientX, clickRect);
        lastDragWasMoved = true;
      } else {
        lastDragWasMoved = true;
        const arr = dragState.type === 'chapter' ? data.chapters : data.slides;
        const item = arr[dragState.index];
        const originalIndex = dragState.index;

        // Calculate target insert position from cursor
        const trackContent = dragState.type === 'chapter'
          ? document.getElementById('chapterTrackContent')
          : document.getElementById('slideTrackContent');
        const rect = trackContent.getBoundingClientRect();
        const relX = Math.max(0, Math.min(dragState.lastClientX - rect.left, rect.width));
        const dropTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

        // Find target index based on drop position
        let targetIdx = arr.length;
        for (let i = 0; i < arr.length; i++) {
          if (i === originalIndex) continue;
          if (dropTime < arr[i].time) { targetIdx = i; break; }
        }

        // Store original durations before reordering
        const durations = arr.map((a, i) => {
          const nextTime = (i < arr.length - 1) ? arr[i + 1].time : videoDuration;
          return nextTime - a.time;
        });
        const itemDuration = durations[originalIndex];

        // Remove item from original position
        arr.splice(originalIndex, 1);
        durations.splice(originalIndex, 1);

        // Adjust target index after removal
        const insertIdx = targetIdx > originalIndex ? targetIdx - 1 : targetIdx;

        // Insert item at new position
        arr.splice(insertIdx, 0, item);
        durations.splice(insertIdx, 0, itemDuration);

        // Recalculate times from durations (preserves all durations)
        if (dragState.type === 'chapter') {
          let t = 0;
          arr.forEach((a, i) => { a.time = Math.round(t * 10) / 10; t += durations[i]; });
        } else {
          // For slides: preserve relative spacing — use drop time for the moved item
          item.time = Math.round(dropTime * 10) / 10;
          arr.sort((a, b) => a.time - b.time);
        }

        const newIndex = arr.indexOf(item);
        selectedItem = { type: dragState.type, index: newIndex };
        render();
        triggerSave();
        showToast('"' + item.title + '" moved to ' + formatTime(item.time));
      }

      dragState = null;
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
    }

    // ===== RESIZE HANDLES =====
    let resizeState = null;
    const MIN_SEGMENT_DURATION = 1;

    function initResize(e, type, index, side) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();

      const trackContent = type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();

      resizeState = {
        type,
        index,
        side,
        startX: e.clientX,
        trackRect: rect,
        moved: false
      };

      document.addEventListener('mousemove', onResizeMove);
      document.addEventListener('mouseup', onResizeEnd);
    }

    function onResizeMove(e) {
      if (!resizeState) return;

      const dx = Math.abs(e.clientX - resizeState.startX);
      if (dx < 3 && !resizeState.moved) return;

      if (!resizeState.moved) {
        resizeState.moved = true;
        document.body.classList.add('is-resizing');
        pushHistory();
      }

      const trackContent = resizeState.type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const rawTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

      const arr = resizeState.type === 'chapter' ? data.chapters : data.slides;
      const i = resizeState.index;

      // Snap to playhead (same magnet effect as scrubber dragging)
      const snapTargets = [0, videoDuration, video.currentTime];
      data.chapters.forEach((ch, ci) => {
        if (resizeState.type === 'chapter' && ci === i) return;
        snapTargets.push(ch.time);
      });
      data.slides.forEach((sl, si) => {
        if (resizeState.type === 'slide' && si === i) return;
        snapTargets.push(sl.time);
      });
      const snapResult = applySnap(rawTime, snapTargets);
      let snappedTime = snapResult.snapped ? snapResult.time : rawTime;

      if (snapResult.snapped) {
        showSnapLine(snapResult.time * pixelsPerSecond);
      } else {
        hideSnapLine();
      }

      if (resizeState.side === 'left') {
        const prevTime = (i > 0) ? arr[i - 1].time + MIN_SEGMENT_DURATION : 0;
        const nextBound = (i < arr.length - 1) ? arr[i + 1].time - MIN_SEGMENT_DURATION : videoDuration - MIN_SEGMENT_DURATION;
        const maxTime = Math.min(nextBound, videoDuration - MIN_SEGMENT_DURATION);
        arr[i].time = Math.max(prevTime, Math.min(maxTime, snappedTime));
      } else {
        const thisStart = arr[i].time + MIN_SEGMENT_DURATION;
        const nextEnd = (i + 2 < arr.length) ? arr[i + 2].time - MIN_SEGMENT_DURATION : videoDuration - MIN_SEGMENT_DURATION;
        arr[i + 1].time = Math.max(thisStart, Math.min(nextEnd, snappedTime));
      }

      updateTrackWidthsInPlace(resizeState.type);
    }

    function updateTrackWidthsInPlace(type) {
      const container = type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const arr = type === 'chapter' ? data.chapters : data.slides;
      const segments = container.querySelectorAll('.' + type + '-segment');
      const dur = videoDuration || 1;

      arr.forEach((item, i) => {
        if (!segments[i]) return;
        const nextTime = (i < arr.length - 1) ? arr[i + 1].time : dur;
        const duration = nextTime - item.time;
        const widthPx = duration * pixelsPerSecond;
        segments[i].style.width = widthPx + 'px';
        if (type === 'slide' && i === 0 && item.time > 0) {
          segments[i].style.marginLeft = (item.time * pixelsPerSecond) + 'px';
        }
        const endTime = item.time + duration;
        const timeRow = segments[i].querySelector('.segment-time-row');
        if (timeRow) timeRow.textContent = formatTime(item.time) + ' - ' + formatTime(endTime);
      });
    }

    function onResizeEnd(e) {
      if (!resizeState) return;

      document.body.classList.remove('is-resizing');
      hideSnapLine();

      if (resizeState.moved) {
        lastDragWasMoved = true;
        render();
        triggerSave();
        showToast('Segment boundary adjusted');
      }

      resizeState = null;
      document.removeEventListener('mousemove', onResizeMove);
      document.removeEventListener('mouseup', onResizeEnd);
    }

    // ===== EXTERNAL FILE DROP =====
    function initExternalDrop() {
      const slideTrack = document.getElementById('slideTrack');
      let dropOverlay = null;
      let dropIndicator = null;
      let enterCount = 0;

      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('drop', (e) => {
        if (!e.target.closest('#slideTrack')) e.preventDefault();
      });

      slideTrack.addEventListener('dragenter', (e) => {
        if (!e.dataTransfer.types.includes('Files')) return;
        enterCount++;
        e.preventDefault();
        if (!dropOverlay) {
          dropOverlay = document.createElement('div');
          dropOverlay.className = 'drop-zone-overlay visible';
          dropOverlay.innerHTML = '<span class="drop-zone-overlay-text">Drop slide deck or image to add slides</span>';
          const trackContent = document.getElementById('slideTrackContent');
          trackContent.style.position = 'relative';
          trackContent.appendChild(dropOverlay);
        }
        announce('Drop zone active. Drop slide deck or image file to add slides.');
      });

      slideTrack.addEventListener('dragover', (e) => {
        if (!e.dataTransfer.types.includes('Files')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';

        if (!dropIndicator) {
          dropIndicator = document.createElement('div');
          dropIndicator.className = 'drag-indicator';
          const label = document.createElement('span');
          label.className = 'drag-indicator-label';
          dropIndicator.appendChild(label);
          const trackContent = document.getElementById('slideTrackContent');
          trackContent.appendChild(dropIndicator);
        }
        const trackContent = document.getElementById('slideTrackContent');
        const rect = trackContent.getBoundingClientRect();
        const relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const time = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));
        dropIndicator.style.left = (time * pixelsPerSecond) + 'px';
        dropIndicator.querySelector('.drag-indicator-label').textContent = formatTime(time);
      });

      slideTrack.addEventListener('dragleave', (e) => {
        enterCount--;
        if (enterCount <= 0) {
          enterCount = 0;
          if (dropOverlay) { dropOverlay.remove(); dropOverlay = null; }
          if (dropIndicator) { dropIndicator.remove(); dropIndicator = null; }
        }
      });

      slideTrack.addEventListener('drop', (e) => {
        e.preventDefault();
        enterCount = 0;
        if (dropOverlay) { dropOverlay.remove(); dropOverlay = null; }
        if (dropIndicator) { dropIndicator.remove(); dropIndicator = null; }

        const allFiles = Array.from(e.dataTransfer.files);
        const imageFiles = allFiles.filter(f => f.type.startsWith('image/'));
        const deckExtensions = ['.ppt', '.pptx', '.pdf', '.key'];
        const deckFiles = allFiles.filter(f => deckExtensions.some(ext => f.name.toLowerCase().endsWith(ext)));

        if (imageFiles.length === 0 && deckFiles.length === 0) {
          showToast('Drop image files or slide decks (PPT, PPTX, PDF)');
          return;
        }

        const trackContent = document.getElementById('slideTrackContent');
        const rect = trackContent.getBoundingClientRect();
        const relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const dropTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

        pushHistory();

        if (deckFiles.length > 0) {
          const file = deckFiles[0];
          const deckName = file.name.replace(/\.[^.]+$/, '');

          // Place slides at chapter boundaries if chapters exist
          let slideTimes = [];
          if (data.chapters.length > 0) {
            slideTimes = data.chapters.map(ch => ch.time);
          } else {
            // No chapters — distribute evenly across video
            const slideCount = 5;
            const spacing = videoDuration / (slideCount + 1);
            for (let i = 0; i < slideCount; i++) {
              slideTimes.push(Math.round((dropTime + i * spacing) * 10) / 10);
            }
          }

          // Use proper handlers for PDF and PPTX — drag & drop starts from 00:00
          const isPdf = file.name.toLowerCase().endsWith('.pdf');
          const isPptx = file.name.toLowerCase().endsWith('.pptx');
          if (isPdf && typeof pdfjsLib !== 'undefined') {
            handlePdfUpload(file, 0);
          } else if (isPptx && typeof JSZip !== 'undefined') {
            handlePptxUpload(file, 0);
          } else {
            addDeckSlides(slideTimes, deckName, file);
          }
          return;
        }

        function addDeckSlides(times, deckName, file) {
          const existingSlideTimes = data.slides.map(s => Math.round(s.time * 10) / 10);
          let added = 0;
          times.forEach((t, i) => {
            const rounded = Math.round(t * 10) / 10;
            if (existingSlideTimes.includes(rounded)) return;
            data.slides.push({ time: rounded, title: 'Slide ' + (i + 1) + ' - ' + deckName, description: '', image: '', deckFile: file ? file.name : null });
            existingSlideTimes.push(rounded);
            added++;
          });
          data.slides.sort((a, b) => a.time - b.time);
          panelFilter = 'slides';
          render();
          triggerSave();
          showToast(added + ' slides added from ' + deckName);
        }

        let added = 0;
        imageFiles.forEach((file, i) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const slideTime = Math.min(videoDuration, dropTime + i * 2);
            data.slides.push({ time: slideTime, title: file.name.replace(/\.[^.]+$/, ''), image: ev.target.result });
            added++;
            if (added === imageFiles.length) {
              data.slides.sort((a, b) => a.time - b.time);
              render();
              triggerSave();
              showToast(imageFiles.length === 1 ? 'Slide added from ' + file.name : imageFiles.length + ' slides added');
            }
          };
          reader.readAsDataURL(file);
        });
      });
    }

    // ===== RESIZE SYNC =====
    window.addEventListener('resize', () => {
      if (videoDuration > 0) {
        const oldPpsMin = ppsMin;
        ppsMin = computePpsMin();
        if (pixelsPerSecond <= oldPpsMin * 1.05) {
          zoomFit();
        } else {
          applyZoom(pixelsPerSecond);
        }
      }
    });

    // ===== INIT =====
    pushHistory();
    render();
    initExternalDrop();

    function revealApp() {
      document.body.classList.remove('is-loading');
      document.getElementById('pageLoader').classList.add('loaded');
      document.querySelectorAll('.timeline-actions button, .timeline-actions label, .zoom-controls button, .zoom-controls input, .player-action, #playBtn').forEach(el => {
        el.removeAttribute('disabled');
      });
      // Set fit zoom and regenerate thumbnails at correct width
      if (videoDuration > 0) {
        zoomFit();
      }
      // Focus first chapter at 00:00 on load (collapsed)
      if (data.chapters.length > 0 && data.chapters[0].time === 0) {
        focusedItem = { type: 'chapter', index: 0 };
        panelFilter = 'chapters';
        updateSidebarActive();
      }
      // Enable rendering, populate DOM while still hidden, then reveal
      appReady = true;
      render();
      requestAnimationFrame(() => {
        document.querySelectorAll('.track-content.is-loading').forEach(el => {
          el.classList.remove('is-loading');
        });
        document.getElementById('timelineLoadingIndicator').classList.add('hidden');
      });
    }

    // Disable CTA tools until app is fully loaded
    document.querySelectorAll('.timeline-actions button, .timeline-actions label, .zoom-controls button, .zoom-controls input, .player-action, #playBtn').forEach(el => {
      el.setAttribute('disabled', 'true');
    });

    let videoCanPlay = false;
    let fontsReady = false;
    let thumbnailsReady = false;

    function checkAllReady() {
      if (videoCanPlay && fontsReady && thumbnailsReady) revealApp();
    }

    if (video.readyState >= 3) {
      videoCanPlay = true;
    } else {
      video.addEventListener('canplay', () => { videoCanPlay = true; checkAllReady(); }, { once: true });
    }

    document.fonts.ready.then(() => { fontsReady = true; checkAllReady(); });

    checkAllReady();

    // Failsafe — reveal after 15s regardless
    setTimeout(revealApp, 15000);
  </script>
</body>
</html>
