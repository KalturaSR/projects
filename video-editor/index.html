<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Structure</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Kaltura DS - Dark Theme */
      --b-100: #000000;
      --b-60: rgba(0, 0, 0, 0.6);
      --b-30: rgba(0, 0, 0, 0.3);
      --w-100: #ffffff;
      --w-80: rgba(255, 255, 255, 0.8);
      --w-60: rgba(255, 255, 255, 0.6);
      --w-50: rgba(255, 255, 255, 0.5);
      --w-40: rgba(255, 255, 255, 0.4);
      --w-30: rgba(255, 255, 255, 0.3);
      --w-20: rgba(255, 255, 255, 0.2);
      --w-10: rgba(255, 255, 255, 0.1);
      --tone-3: #888888;
      --tone-4: #bdbdbd;
      --blue: #006EFA;
      --blue-hover: #0057cc;
      --pink: #FF9DFF;
      --ai-gradient: linear-gradient(68deg, var(--blue) 10.87%, #2485FF 29.96%, var(--pink) 133.89%);
      --success: #4ecdc4;
      --warning: #ffa726;
      --danger: #ff4444;
      --roundness-1: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 0 0 1px rgba(0,0,0,0.2), 0 8px 60px -16px rgba(0,0,0,0.2);
      /* Semantic aliases */
      --bg-primary: var(--b-100);
      --bg-secondary: var(--b-100);
      --bg-surface: var(--w-10);
      --bg-elevated: var(--w-20);
      --text-primary: var(--w-100);
      --text-secondary: var(--w-80);
      --text-tertiary: var(--w-50);
      --accent-primary: var(--blue);
      --accent-hover: var(--blue-hover);
      --accent-subtle: rgba(0, 110, 250, 0.15);
      --border: var(--w-40);
      --border-subtle: var(--w-10);
      --chapter-color: var(--w-100);
      --chapter-bg: var(--w-10);
      --slide-color: var(--w-100);
      --slide-bg: var(--w-10);
      --radius-sm: var(--roundness-1);
    }

    body {
      font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--b-100);
      color: var(--w-100);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid var(--w-30);
      height: 67px;
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--roundness-1);
      border: none;
      background: transparent;
      color: var(--w-100);
      cursor: pointer;
      font-size: 20px;
      transition: all 0.15s;
    }

    .close-btn:hover {
      background: var(--w-10);
      color: var(--w-100);
    }

    .close-btn:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .editor-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--w-100);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .save-status {
      font-size: 12px;
      color: var(--w-50);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .save-status.saving {
      color: var(--warning);
    }

    .save-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      transition: background 0.3s;
    }

    .save-status.saving .save-dot {
      background: var(--warning);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: var(--roundness-1);
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .btn-ghost {
      background: transparent;
      color: var(--w-80);
      border: 1px solid var(--w-20);
    }

    .btn-ghost:hover {
      background: var(--w-10);
      color: var(--w-100);
      border-color: var(--w-30);
    }

    .btn-ghost .btn-icon {
      display: flex;
      align-items: center;
    }

    .btn-primary {
      background: var(--blue);
      color: var(--w-100);
      border: none;
    }

    .btn-primary:hover {
      background: var(--blue-hover);
      transform: translateY(-1px);
    }

    .btn-primary .btn-icon {
      display: flex;
      align-items: center;
    }

    .btn-ai {
      background: var(--ai-gradient);
      color: var(--w-100);
      border: none;
      box-shadow: 0 2px 8px rgba(0, 110, 250, 0.3);
    }

    .btn-ai:hover {
      opacity: 0.92;
      box-shadow: 0 4px 16px rgba(0, 110, 250, 0.4);
      transform: translateY(-1px);
    }

    .btn-ai .btn-icon {
      display: flex;
      align-items: center;
      width: 24px;
      height: 24px;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: var(--roundness-1);
      background: transparent;
      color: var(--w-80);
      border: 1px solid var(--w-20);
    }

    .btn-sm:hover {
      background: var(--w-10);
      color: var(--w-100);
      border-color: var(--w-30);
    }

    .btn-sm .btn-icon {
      display: flex;
      align-items: center;
    }

    .btn-borderless {
      padding: 4px 8px;
      font-size: 14px;
      border-radius: var(--roundness-1);
      background: transparent;
      color: var(--w-80);
      border: none;
    }

    .btn-borderless:hover {
      background: var(--w-10);
      color: var(--w-100);
    }

    .btn-borderless .btn-icon {
      display: flex;
      align-items: center;
      width: 24px;
      height: 24px;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(255, 68, 68, 0.3);
      font-size: 14px;
      padding: 8px 12px;
    }

    .btn-danger:hover {
      background: rgba(255, 68, 68, 0.1);
      border-color: var(--danger);
    }

    .btn-danger .btn-icon {
      display: flex;
      align-items: center;
    }

    /* Editor Body */
    .editor-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Main Canvas */
    .main-canvas {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    /* Main Area: Player + Sidebar row */
    .main-area {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Video Player */
    .video-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      min-height: 300px;
    }

    .video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      cursor: pointer;
    }

    .player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: white;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 0.1s;
    }

    .play-btn:active {
      transform: scale(0.9);
    }

    .play-btn:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .progress-bar::before {
      content: '';
      position: absolute;
      top: -19px;
      bottom: -19px;
      left: 0;
      right: 0;
    }

    .progress-bar:hover {
      height: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--blue);
      border-radius: 3px;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-bar.has-chapters {
      background: transparent;
      display: flex;
      gap: 2px;
      border-radius: 3px;
    }
    .progress-bar.has-chapters .progress-fill {
      display: none;
    }
    .progress-bar.has-chapters .progress-handle {
      display: none;
    }
    .progress-chapter-seg {
      height: 100%;
      border-radius: 100px;
      background: rgba(255,255,255,0.5);
      position: relative;
      overflow: hidden;
    }
    .progress-chapter-seg-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--blue);
      border-radius: 100px;
    }


    .progress-handle {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      box-shadow: var(--shadow-sm);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .progress-tooltip {
      position: absolute;
      bottom: 100%;
      margin-bottom: 10px;
      left: 0;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      line-height: 1.4;
      padding: 5px 8px;
      border-radius: 4px;
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 10;
    }
    .progress-bar:hover .progress-tooltip {
      opacity: 1;
    }

    .progress-bar:hover .progress-handle {
      opacity: 1;
    }

    .timestamp {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      font-variant-numeric: tabular-nums;
      min-width: 100px;
    }

    .player-action {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }

    .player-action:hover {
      color: white;
      background: rgba(255,255,255,0.1);
    }

    .player-action:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    /* Selected Slide Overlay */
    .player-slide-overlay {
      position: absolute;
      bottom: 61px;
      right: 16px;
      width: 268px;
      z-index: 5;
      display: none;
      flex-direction: column;
      align-items: flex-end;
    }

    .player-slide-overlay.visible {
      display: flex;
    }

    .player-slide-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
      padding: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      height: 32px;
      margin-left: auto;
      transition: background 0.15s;
    }

    .player-slide-toggle:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .player-slide-toggle svg {
      transition: transform 0.2s;
    }

    .player-slide-overlay.collapsed .player-slide-toggle svg {
      transform: rotate(180deg);
    }

    .player-slide-image-wrap {
      margin-top: 5px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2), 0 8px 60px -16px rgba(0, 0, 0, 0.2);
      position: relative;
      width: 268px;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player-slide-overlay.collapsed .player-slide-image-wrap {
      display: none;
    }

    .player-slide-image-wrap::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
      z-index: 1;
      pointer-events: none;
    }

    .player-switch-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 0;
      transition: background 0.15s;
    }

    .player-switch-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    .player-switch-btn svg {
      opacity: 0.8;
    }

    /* Slide-main mode: slide is full player area, video is the small thumbnail */
    .video-area.slide-main .video-player {
      position: absolute;
      bottom: 61px;
      right: 16px;
      width: 223px;
      height: auto;
      aspect-ratio: 16/9;
      border-radius: 8px;
      z-index: 6;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2), 0 8px 60px -16px rgba(0, 0, 0, 0.2);
      object-fit: cover;
      cursor: pointer;
    }

    .video-area.slide-main .player-slide-overlay {
      position: absolute;
      inset: 0;
      bottom: 46px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 1;
    }

    .video-area.slide-main .player-slide-overlay.visible {
      display: flex;
    }

    .video-area.slide-main .player-slide-toggle {
      display: none;
    }

    .video-area.slide-main .player-slide-image-wrap {
      width: 100%;
      height: 100%;
      margin-top: 0;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .video-area.slide-main .player-slide-image-wrap::before {
      display: none;
    }

    .video-area.slide-main .player-slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0;
    }

    .video-area.slide-main .player-slide-image-wrap .player-switch-btn {
      display: none;
    }

    /* Video thumbnail CTAs: only visible in slide-main mode, positioned over video thumb */
    .video-thumb-ctas {
      display: none;
      position: absolute;
      bottom: calc(61px + 223px * 9 / 16 + 5px);
      right: 16px;
      width: 223px;
      z-index: 8;
    }

    .video-thumb-ctas .video-switch-btn {
      position: absolute;
      top: calc(100% + 5px + 8px);
      right: 8px;
      z-index: 9;
    }

    .video-area.slide-main .video-thumb-ctas {
      display: block;
    }

    .video-area.slide-main.video-thumb-hidden .video-player {
      display: none;
    }

    .video-area.slide-main.video-thumb-hidden .video-thumb-ctas .player-slide-toggle svg {
      transform: rotate(180deg);
    }

    .video-area.slide-main.video-thumb-hidden .video-thumb-ctas .video-switch-btn {
      display: none;
    }

    .player-slide-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }

    /* Timeline Area */
    .timeline-area {
      background: var(--b-100);
      border-top: none;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }

    #timelineScrollable {
      position: relative;
    }
    .timeline-area::-webkit-scrollbar {
      height: 8px;
    }
    .timeline-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .timeline-area::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 4px;
    }
    .timeline-area::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.5);
    }

    .timeline-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: none;
      position: sticky;
      left: 0;
      background: var(--b-100);
      z-index: 5;
    }

    .timeline-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--w-50);
      border-radius: var(--roundness-1);
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .toolbar-icon-btn:hover {
      color: var(--w-100);
      background: var(--w-10);
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .zoom-btn {
      min-width: 44px;
      height: 32px;
      min-height: 44px;
      padding: 0 8px;
      border-radius: var(--roundness-1);
      border: none;
      background: transparent;
      color: var(--w-100);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .zoom-btn:hover {
      background: var(--w-10);
      color: var(--w-100);
    }

    .zoom-btn:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .zoom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 4px;
      border-radius: 2px;
      background: var(--w-20);
      outline: none;
      cursor: pointer;
      margin: 0 4px;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--w-100);
      cursor: pointer;
      border: 2px solid var(--blue);
    }

    .zoom-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--w-100);
      cursor: pointer;
      border: 2px solid var(--blue);
    }

    .zoom-slider:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 4px;
    }

    /* Timeline Tracks */
    .timeline-tracks {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 0 10px 24px;
    }

    .time-ruler {
      height: 32px;
      padding: 0 24px 0 64px;
      position: relative;
      border-bottom: none;
      cursor: pointer;
    }

    .time-marks {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .time-mark {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--w-50);
      font-variant-numeric: tabular-nums;
      transform: translateX(-50%);
      white-space: nowrap;
      pointer-events: none;
    }

    .time-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
    }

    .time-tick-major {
      height: 10px;
      background: var(--w-30);
    }

    .time-tick-minor {
      height: 5px;
      background: var(--w-10);
    }

    .playhead-ruler {
      position: absolute;
      top: 0;
      width: 1px;
      background: #e53935;
      height: 100%;
      z-index: 10;
      cursor: col-resize;
      will-change: left;
    }

    .playhead-ruler::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -7px;
      width: 16px;
      height: 16px;
      background: #e53935;
      border-radius: 3px 3px 50% 50%;
      clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%);
    }

    .playhead-ruler::after {
      content: '';
      position: absolute;
      top: 0;
      left: -8px;
      width: 18px;
      height: 100%;
      cursor: col-resize;
    }

    .playhead-ruler:hover::before {
      background: #ff5252;
      transform: scale(1.15);
    }

    .playhead-ruler.dragging::before {
      background: #ff5252;
      transform: scale(1.2);
    }

    .track {
      display: flex;
      align-items: center;
      height: 40px;
      border-bottom: none;
      position: relative;
      gap: 8px;
      padding: 0 24px 0 0;
    }
    .track-chapters {
      height: 40px;
    }
    .track-slides {
      height: 40px;
      margin-top: 4px;
    }
    .track-video {
      height: 40px;
    }

    .track-label {
      width: 32px;
      padding: 0;
      font-size: 0;
      color: var(--w-50);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      left: 0;
      background: var(--b-100);
      z-index: 2;
    }

    .track-dot {
      width: 16px;
      height: 16px;
      border-radius: 0;
      display: block;
    }

    .track-dot-chapter { background: transparent; }
    .track-dot-slide { background: transparent; }

    .track-content {
      flex: 1;
      height: 100%;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    @keyframes trackShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .track-content.is-loading {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: trackShimmer 1.8s ease infinite;
    }
    .track-content.is-loading > *:not(.track-loader-icon) {
      display: none;
    }
    .track-loader-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .track-loader-icon svg {
      animation: spinLoader 0.8s linear infinite;
    }
    .track-content:not(.is-loading) .track-loader-icon {
      display: none;
    }

    @keyframes spinLoader {
      to { transform: rotate(360deg); }
    }
    .timeline-loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
    }
    .timeline-loading-indicator svg {
      animation: spinLoader 0.8s linear infinite;
    }
    .timeline-loading-indicator.hidden {
      display: none;
    }

    /* Chapter Segments */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chapter-segment {
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 2px solid rgba(255,255,255,0.5);
      background: transparent;
      backdrop-filter: blur(16px);
      color: var(--w-100);
    }

    .chapter-segment:hover {
      border-color: rgba(255,255,255,0.7);
      background: var(--w-10);
    }

    .chapter-segment:hover .resize-handle,
    .slide-segment:hover .resize-handle,
    body.is-resizing .resize-handle {
      opacity: 1;
    }

    .resize-handle {
      position: absolute;
      top: 0;
      width: 14px;
      height: 100%;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      cursor: col-resize;
      background: var(--w-30);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .resize-handle.left {
      left: -4px;
      border-radius: 4px 0 0 4px;
      padding-left: 4px;
    }

    .resize-handle.right {
      right: -4px;
      border-radius: 0 4px 4px 0;
      padding-right: 4px;
    }

    .resize-handle::after {
      content: '';
      width: 2px;
      height: calc(100% - 10px);
      background: var(--w-80);
      border-radius: 2px;
    }

    .resize-handle:hover {
      background: var(--w-50);
    }

    .chapter-segment.active .resize-handle,
    .slide-segment.active .resize-handle {
      background: var(--blue);
    }
    .chapter-segment.active .resize-handle::after,
    .slide-segment.active .resize-handle::after {
      background: var(--w-100);
    }

    body.is-resizing {
      cursor: col-resize !important;
    }
    body.is-resizing * {
      cursor: col-resize !important;
    }

    .chapter-segment:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .chapter-segment.active {
      border-color: var(--blue);
    }

    /* Slide Segments */
    .slide-segment {
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 2px solid rgba(255,255,255,0.5);
      background: transparent;
      backdrop-filter: blur(16px);
      color: var(--w-100);
      gap: 8px;
    }

    .slide-segment:hover {
      border-color: rgba(255,255,255,0.7);
      background: var(--w-10);
    }

    .slide-segment:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .slide-segment.active {
      border-color: var(--blue);
    }

    .slide-segment-thumb {
      width: 52px;
      height: 29px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
      background: var(--bg-surface);
    }

    .segment-title,
    .slide-segment-label {
      display: none;
    }

    .segment-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
      padding: 0 8px;
      justify-content: center;
    }

    .segment-time-row {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
      line-height: 12px;
    }

    .segment-title-row {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: normal;
    }

    /* Slide thumbnail in panel */
    .slide-thumb-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .slide-thumbnail-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide-thumb-replace {
      position: absolute;
      bottom: 8px;
      right: 8px;
      height: 24px;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 700;
      background: var(--b-60);
      color: var(--w-100);
      border: none;
      border-radius: var(--roundness-1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .slide-thumb-replace:hover {
      background: rgba(0,0,0,0.8);
    }

    .slide-thumbnail-placeholder {
      width: 100%;
      height: 100%;
      background: var(--b-30);
      border: 1px dashed var(--w-40);
      border-radius: 8px;
    }

    .slide-form-properties-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 21px;
      color: var(--w-100);
    }

    .slide-thumb-small {
      width: 154px;
      aspect-ratio: 154 / 89;
    }

    .form-input-with-icon {
      position: relative;
      width: 100%;
    }

    .form-input-with-icon .form-input {
      padding-right: 36px;
    }

    .form-input-icon-btn {
      position: absolute;
      right: 0;
      top: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--roundness-1);
      cursor: pointer;
      color: var(--w-100);
      padding: 4px;
      transition: background 0.15s;
    }

    .form-input-icon-btn:hover {
      background: var(--w-10);
    }

    .form-textarea-wrapper {
      width: 100%;
      border-radius: var(--roundness-1);
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.3);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .form-textarea-wrapper:hover {
      border-color: rgba(255,255,255,0.6);
    }

    .form-textarea-wrapper:focus-within {
      border-color: #006EFA;
    }

    .form-textarea-toolbar {
      display: flex;
      align-items: center;
      padding: 4px 4px 0;
      gap: 0;
    }

    .form-textarea-toolbar-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--roundness-1);
      cursor: pointer;
      color: var(--w-100);
      padding: 4px;
      transition: background 0.15s;
    }

    .form-textarea-toolbar-btn:hover {
      background: var(--w-10);
    }

    .form-textarea-wrapper .form-textarea {
      border: none;
      background: transparent;
      min-height: 60px;
      resize: vertical;
    }

    .form-textarea-wrapper .form-textarea:hover {
      border-color: transparent;
    }

    .form-textarea-wrapper .form-textarea:focus {
      border-color: transparent;
    }

    /* Video Track */
    .video-track-content {
      flex: 1;
      height: 40px;
      margin-right: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
      background: rgba(255, 255, 255, 0.05);
    }

    .video-track-content.loaded {
      background: transparent;
    }

    .video-track-content canvas {
      height: 100%;
      width: 100%;
      border-radius: 8px;
      image-rendering: auto;
    }

    .video-track-loaders {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      pointer-events: none;
    }
    .video-track-loaders svg {
      width: 16px;
      height: 16px;
      opacity: 0.4;
      animation: spinLoader 0.8s linear infinite;
    }
    .video-track-content.loaded .video-track-loaders {
      display: none;
    }

    .track-label-video { color: var(--w-50); opacity: 1; }

    /* Drag styles */
    .chapter-segment, .slide-segment {
      cursor: grab;
      user-select: none;
    }

    .chapter-segment:active, .slide-segment:active {
      cursor: grabbing;
    }

    body.is-dragging,
    body.is-dragging * {
      cursor: grabbing !important;
    }

    .chapter-segment.dragging, .slide-segment.dragging {
      opacity: 0.4;
      cursor: grabbing;
      box-shadow: none;
      z-index: 20;
      transform: scale(0.96);
      width: 0 !important;
      padding: 0 !important;
      border-width: 0 !important;
      overflow: hidden;
      margin: 0;
      transition: width 0.2s, opacity 0.2s, transform 0.2s, padding 0.2s;
    }

    .chapter-segment.gap-after, .slide-segment.gap-after {
      transition: margin 0.15s ease;
    }
    .chapter-segment.gap-before, .slide-segment.gap-before {
      transition: margin 0.15s ease;
    }

    .drag-ghost-placeholder {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 25;
      pointer-events: none;
      opacity: 0.35;
      border-radius: var(--radius-md);
      border: 2px dashed #4da6ff;
      background: rgba(77, 166, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .drag-ghost-placeholder-content {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #4da6ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    /* External file drop indicator line */
    .drag-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #4da6ff;
      border-radius: 2px;
      z-index: 25;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(77, 166, 255, 0.5);
    }

    .drop-zone-highlight {
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 4px;
      background: var(--blue);
      border-radius: 2px;
      z-index: 25;
      pointer-events: none;
      opacity: 0.8;
      transition: left 0.1s ease;
    }

    /* Drag ghost thumbnail */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      transform: scale(0.95) translateY(-10px);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--blue);
      max-width: 200px;
      max-height: 60px;
      overflow: hidden;
      transition: opacity 0.12s;
    }
    .drag-ghost.visible { opacity: 0.8; }

    /* Drag indicator timestamp label */
    .drag-indicator-label {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: #4da6ff;
      color: var(--w-100);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Track drop target highlight */
    .track.drop-target-active {
      background: rgba(0, 110, 250, 0.06);
      box-shadow: inset 0 0 0 1px rgba(0, 110, 250, 0.25);
      border-radius: var(--radius-md);
      transition: background 0.2s, box-shadow 0.2s;
    }

    /* Snap indicator line */
    .snap-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ff4081;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .snap-line.active {
      opacity: 1;
      box-shadow: 0 0 6px #ff4081;
    }

    /* External file drop zone overlay */
    .drop-zone-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 110, 250, 0.1);
      border: 2px dashed var(--blue);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .drop-zone-overlay.visible { opacity: 1; }
    .drop-zone-overlay-text {
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
    }

    /* Playhead on tracks */
    .tracks-playhead {
      position: absolute;
      top: 0;
      width: 1px;
      background: #e53935;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      opacity: 0.8;
      left: 64px;
      will-change: left;
    }

    .tracks-playhead.dragging {
      opacity: 1;
      box-shadow: 0 0 6px rgba(229, 57, 53, 0.5);
    }

    .tracks-hover-scrubber {
      position: absolute;
      top: 0;
      width: 1px;
      background: rgba(255,255,255,0.4);
      height: 100%;
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      left: 64px;
      will-change: left;
      transition: opacity 0.1s;
    }

    .hover-scrubber-tooltip {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--w-20);
      backdrop-filter: blur(16px);
      color: var(--w-100);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 3px 8px;
      border-radius: var(--roundness-1);
      border: 1px solid var(--w-30);
      white-space: nowrap;
      pointer-events: none;
    }

    /* Current time tooltip */
    .scrubber-tooltip {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--w-20);
      backdrop-filter: blur(16px);
      color: var(--w-100);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 3px 8px;
      border-radius: var(--roundness-1);
      border: 1px solid var(--w-30);
      white-space: pre;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .playhead-ruler.dragging .scrubber-tooltip {
      top: -42px;
    }

    .playhead-ruler:hover .scrubber-tooltip,
    .playhead-ruler.dragging .scrubber-tooltip {
      opacity: 1;
    }

    /* Right Panel */
    .right-panel {
      width: 360px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      border-left: 1px solid var(--w-10);
      min-height: 0;
    }

    /* Panel Tabs (inside right panel) */
    .panel-tabs {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--w-10);
      flex-shrink: 0;
    }

    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--w-10);
      flex-shrink: 0;
    }

    .panel-footer-toggle {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 16px 16px;
      flex-shrink: 0;
      border-top: 1px solid var(--w-10);
    }

    .panel-footer-toggle .mode-toggle {
      padding: 0;
      border-bottom: none;
    }
    .mode-toggle-label {
      font-size: 11px;
      color: var(--w-60);
      white-space: nowrap;
    }
    .mode-toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      background: var(--w-30);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .mode-toggle-switch.active {
      background: var(--blue);
    }
    .mode-toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
    }
    .mode-toggle-switch.active::after {
      transform: translateX(16px);
    }

    .panel-tab {
      flex: 1 0 0;
      height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      border: none;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--w-100);
      cursor: pointer;
      transition: color 0.15s;
    }

    .panel-tab:hover:not(:disabled) {
      color: var(--w-100);
    }

    .panel-tab.active {
      color: var(--w-100);
      border-bottom-color: var(--blue);
    }

    .panel-tab:disabled {
      color: var(--w-20);
      cursor: not-allowed;
    }

    .panel-tab svg {
      width: 24px;
      height: 24px;
    }

    .panel-tab {
      position: relative;
    }

    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #000000;
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      padding: 6px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .chapter-segment[data-tooltip]:hover::after,
    .slide-segment[data-tooltip]:hover::after {
      top: auto;
      bottom: calc(100% + 6px);
    }

    .panel-section {
      padding: 16px 24px;
      border-bottom: 1px solid var(--w-10);
    }

    .panel-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--w-50);
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 0; }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      line-height: 16px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.3);
      color: #ffffff;
      font-size: 14px;
      line-height: 16px;
      font-family: 'Lato', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input::placeholder { color: rgba(255,255,255,0.4); }
    .form-input:hover { border-color: rgba(255,255,255,0.6); }
    .form-input:focus { border-color: #006EFA; }

    .form-textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.3);
      color: #ffffff;
      font-size: 14px;
      line-height: 16px;
      outline: none;
      resize: vertical;
      min-height: 88px;
      font-family: 'Lato', sans-serif;
      transition: border-color 0.15s;
    }

    .form-textarea::placeholder { color: rgba(255,255,255,0.4); }
    .form-textarea:hover { border-color: rgba(255,255,255,0.6); }
    .form-textarea:focus { border-color: #006EFA; }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .form-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .form-label {
      font-size: 14px;
      font-weight: 700;
      color: white;
      line-height: 16px;
    }

    .form-counter {
      font-size: 14px;
      font-weight: 400;
      color: white;
      line-height: 16px;
    }

    .timestamp-input {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timestamp-input .form-input {
      width: 64px;
      font-variant-numeric: tabular-nums;
    }

    .timestamp-separator {
      color: var(--w-50);
      font-size: 13px;
      font-weight: 400;
    }

    .use-current-btn {
      position: relative;
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: background 0.15s;
    }

    .use-current-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    .use-current-btn svg {
      display: block;
    }

    .use-current-btn .ds-hint {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      top: calc(100% + 6px);
      left: 50%;
      translate: -50% 0;
      display: inline-flex;
      flex-direction: column-reverse;
      align-items: center;
    }

    .use-current-btn:hover .ds-hint {
      opacity: 1;
      transform: scale(1);
    }

    .use-current-btn .ds-hint-body {
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 12px;
      line-height: 16px;
      padding: 6px 8px;
      border-radius: 4px;
      white-space: nowrap;
      font-family: 'Lato', sans-serif;
    }

    .use-current-btn .ds-hint-arrow {
      line-height: 0;
      margin-bottom: -1px;
    }

    .use-current-btn .ds-hint-arrow svg path {
      fill: #ffffff;
    }

    .panel-actions {
      padding: 16px 24px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--w-10);
    }

    /* Introduction Section */
    .intro-section {
      padding: 16px 24px;
      border-bottom: 1px solid var(--w-10);
      background: var(--w-10);
      cursor: pointer;
      transition: background 0.15s;
    }

    .intro-section:hover { background: var(--w-20); }
    .intro-section.active { background: rgba(0, 110, 250, 0.15); border-left: 3px solid var(--blue); }

    .intro-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--w-50);
      background: var(--b-60);
      padding: 3px 8px;
      border-radius: var(--roundness-1);
      margin-bottom: 8px;
    }

    .intro-title-display {
      font-size: 14px;
      font-weight: 700;
      color: var(--w-100);
      margin-bottom: 4px;
    }

    .intro-text-display {
      font-size: 13px;
      color: var(--w-80);
      line-height: 1.5;
    }

    /* Accordion List */
    .accordion-list {
      list-style: none;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;

      scrollbar-color: rgba(255,255,255,0.3) transparent;

    .accordion-list::-webkit-scrollbar { width: 6px; }
    .accordion-list::-webkit-scrollbar-track { background: transparent; }
    .accordion-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    .accordion-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }

    .accordion-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--w-50);
      padding: 12px 16px;
      border-bottom: 1px solid var(--w-10);
      background: rgba(255,255,255,0.04);
    }

    .accordion-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px;
      border-bottom: 1px solid var(--w-10);
      background: rgba(255,255,255,0.04);
      flex-shrink: 0;
    }

    .accordion-section-header .accordion-section-title {
      padding: 0;
      border-bottom: none;
      background: none;
    }

    .section-clear-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      height: 28px;
      border: none;
      background: none;
      border-radius: 4px;
      color: var(--w-50);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .section-clear-btn:hover {
      color: var(--w-100);
      background: rgba(255,255,255,0.1);
    }


    .accordion-item:not(.expanded) {
      border-bottom: 1px solid var(--w-30);
      flex-shrink: 0;
      min-height: 48px;
      animation: fadeSlideIn 0.2s ease both;
    }

    .accordion-item.focused:not(.expanded) {
      background: rgba(99, 147, 242, 0.08);
      border-left: 3px solid var(--blue);
    }
    .accordion-item.focused:not(.expanded) .accordion-row-time,
    .accordion-item.focused:not(.expanded) .accordion-row-title {
      color: var(--w-100);
    }

    .accordion-item.expanded {
      display: flex;
      flex-direction: column;
      overflow: visible;
      background: rgba(255,255,255,0.04);
    }

    .accordion-row {

      align-items: center;
      gap: 16px;

      cursor: pointer;
      transition: background 0.15s;
    }

    .accordion-item:not(.expanded) > .accordion-row:hover {
      background: var(--w-10);
    }

    .accordion-item:not(.expanded) > .accordion-row:hover .accordion-row-time,
    .accordion-item:not(.expanded) > .accordion-row:hover .accordion-row-title {
      color: var(--w-100);
    }

    .accordion-item.expanded > .accordion-row {
      flex-shrink: 0;
      background: var(--w-10);
      border-left: 4px solid var(--blue);
      border-bottom: 1px solid var(--w-10);
    }

    .accordion-item.expanded > .accordion-row .accordion-row-time,
    .accordion-item.expanded > .accordion-row .accordion-row-title {
      color: var(--w-100);
    }

    .accordion-row-holder {
      display: flex;
      flex: 1 0 0;
      gap: 16px;
      align-items: center;
      min-width: 0;
      font-weight: 700;
      color: var(--w-100);
    }

    .accordion-row-time {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--w-100);
      width: 35px;
      flex-shrink: 0;
      text-align: center;
    }

    .accordion-row-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--w-100);
      flex: 1 0 0;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 18px;
    }

    .accordion-row-chevron {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s;
      color: var(--w-50);
      cursor: pointer;
      border-radius: 4px;
    }

    .accordion-row-chevron:hover {
      color: var(--w-100);
      background: rgba(255,255,255,0.1);
    }

    .accordion-row-chevron svg {
      width: 16px;
      height: 16px;
    }

    .accordion-item.expanded > .accordion-row .accordion-row-chevron {
      transform: rotate(90deg);
    }

    .accordion-row-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 4px 2px;
      border-radius: 4px;
      line-height: normal;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .accordion-row-badge-ch {
      color: var(--blue);
      background: rgba(0, 110, 250, 0.3);
      border: 1px solid var(--blue);
    }

    .accordion-row-badge-sl {
      color: var(--w-80);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--w-50);
    }

    .accordion-body {
      display: flex;
      flex-direction: column;
      background: var(--w-10);
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.25s ease, opacity 0.2s ease;
    }

    .accordion-item.expanded > .accordion-body {
      max-height: 600px;
      opacity: 1;
      overflow: visible;
      transition: max-height 0.3s ease, opacity 0.25s ease 0.05s;
    }

    .accordion-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--w-10);
    }

    .accordion-form .form-group {
      margin-bottom: 0;
    }

    .accordion-delete-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      padding-bottom: 24px;
      flex-shrink: 0;
    }

    .accordion-delete-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--w-100);
      font-size: 14px;
      font-weight: 700;
      font-family: 'Lato', sans-serif;
      transition: background 0.15s;
      border: none;
      background: transparent;
      border-radius: 4px;
    }

    .accordion-delete-btn:hover {
      background: var(--w-10);
    }

    .accordion-delete-btn svg {
      width: 24px;
      height: 24px;
    }

    /* AI Badge */
    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      background: var(--ai-gradient);
      color: var(--w-100);
      padding: 2px 8px;
      border-radius: var(--roundness-1);
    }

    /* Selected Item Indicator */
    .selected-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: rgba(0, 110, 250, 0.08);
      border-bottom: 1px solid var(--w-10);
      border-left: 3px solid var(--blue);
    }

    .selected-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .selected-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--w-100);
      flex: 1;
    }

    .selected-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--w-50);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }

    /* Empty State */
    .track-empty {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .track-empty-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--w-50);
      border: none;
      border-radius: var(--radius-md);
      padding: 0 16px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: color 0.15s;
    }

    .track-empty-text:hover {
      color: var(--w-80);
    }

    .panel-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 60px 24px 24px;
      text-align: center;
    }

    .panel-empty-icon {
      display: none;
    }

    .panel-empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--w-100);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .panel-empty-desc {
      font-size: 16px;
      font-weight: 400;
      color: var(--w-100);
      line-height: 21px;
      margin-bottom: 24px;
      max-width: 320px;
    }

    .panel-empty-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 220px;
      align-items: center;
    }

    .btn-ai-lg {
      padding: 0 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 4px;
      background: linear-gradient(70deg, #006EFA 11%, #2485FF 30%, #FF9DFF 134%);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 40px;
      transition: all 0.2s;
    }

    .btn-ai-lg:hover {
      opacity: 0.9;
    }

    .btn-ai-lg:active { transform: scale(0.97); }

    .btn-ai-lg .btn-icon {
      display: flex;
      align-items: center;
      width: 24px;
      height: 24px;
    }

    .panel-empty-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      color: var(--w-50);
      font-size: 11px;
      font-weight: 700;
      margin-top: 16px;
    }

    .panel-empty-divider::before,
    .panel-empty-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--w-30);
    }

    .panel-empty-secondary {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 320px;
      margin-top: 16px;
      justify-content: center;
    }

    .btn-secondary-sm {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: var(--roundness-1);
      background: transparent;
      color: var(--w-80);
      border: 1px solid var(--w-20);
      cursor: pointer;
      transition: all 0.15s;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary-sm:hover {
      background: var(--w-10);
      color: var(--w-100);
      border-color: var(--w-30);
    }

    .btn-secondary-sm .btn-icon {
      display: flex;
      align-items: center;
    }

    .hidden { display: none !important; }

    /* Panel Intro View */
    .panel-intro-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 16px 16px;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .panel-intro-form {
      display: flex;
      flex-direction: column;
      width: 100%;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }

    .panel-intro-form::-webkit-scrollbar { width: 6px; }
    .panel-intro-form::-webkit-scrollbar-track { background: transparent; }
    .panel-intro-form::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

    .panel-intro-form .panel-intro-view {
      padding: 0;
    }

    .panel-intro-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 100%;
    }

    .panel-intro-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
      line-height: 1.2;
      text-align: center;
    }

    .panel-intro-desc {
      font-size: 16px;
      font-weight: 400;
      color: white;
      line-height: 21px;
      text-align: center;
      margin: 0;
    }

    .panel-intro-card {
      background: rgba(255,255,255,0.16);
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .panel-intro-card-desc {
      font-size: 14px;
      font-weight: 400;
      color: white;
      line-height: 1.4;
      text-align: center;
      margin: 0;
    }

    .panel-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 60px 24px 32px;
      text-align: center;
    }

    .panel-empty-state-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--w-100);
    }

    .panel-empty-state-desc {
      font-size: 13px;
      font-weight: 400;
      color: var(--w-50);
      line-height: 1.4;
      margin: 0;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 4px;
      height: 24px;
      padding: 0 8px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: rgba(0,0,0,0.8);
    }

    .pill-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .pill-btn-md {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 32px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.6);
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .pill-btn-md:hover {
      background: rgba(0,0,0,0.8);
    }

    .pill-btn-md svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .panel-getstarted {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      text-align: center;
    }

    .panel-getstarted-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
      line-height: 1.2;
    }

    .panel-getstarted-desc {
      font-size: 16px;
      font-weight: 400;
      color: white;
      line-height: 21px;
      margin: 0;
    }

    .panel-getstarted-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .panel-getstarted-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .panel-getstarted-divider > span:first-child,
    .panel-getstarted-divider > span:last-child {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.3);
    }

    .panel-getstarted-divider-text {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(100%) translateX(50vw);
      background: var(--b-80);
      backdrop-filter: blur(16px);
      color: var(--w-100);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--w-20);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 200;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      max-width: 400px;
      white-space: nowrap;
    }

    .toast.visible {
      transform: translateX(-50%);
      opacity: 1;
      pointer-events: auto;
    }

    /* AI Loading */
    .ai-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      text-align: center;
      flex: 1;
    }

    .ai-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--w-20);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .ai-loading-text {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .ai-loading-sub {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #1a1a1a;
      border: 1px solid var(--w-30);
      border-radius: var(--radius-md);
      padding: 24px;
      min-width: 360px;
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal-overlay.visible .modal {
      transform: scale(1);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Preview overlay */
    .preview-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .preview-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .preview-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--blue);
      color: var(--w-100);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .preview-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-close:hover { background: rgba(255,255,255,0.2); }

    .preview-chapters {
      display: flex;
      gap: 12px;

      outline-offset: 2px;

      outline-offset: 2px;

    }

    .playhead-ruler::after {
      width: 44px;
      left: -22px;
    }

        padding: 24px 16px;

      clip: rect(0,0,0,0);

      height: 1px;
    }

    .track-dot-slide::after {
      content: 'Sl';
      position: absolute;
      clip: rect(0,0,0,0);
      width: 1px;
      height: 1px;
    }
