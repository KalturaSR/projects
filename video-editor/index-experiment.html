  <!-- Preview Overlay -->
  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-badge">Preview Mode</div>
    <button class="preview-close" id="previewCloseBtn">&#10005;</button>
    <div class="preview-chapters" id="previewChapters"></div>
  </div>

  <script>
    // ===== DATA =====

    let data = {
      introduction: {
        title: '',
        text: ''
      },
      chapters: [],
      slides: []
    };

    let selectedItem = null; // { type: 'chapter'|'slide'|'intro', index: number }
    let panelFilter = 'intro'; // 'all' | 'intro' | 'chapters' | 'slides'
    let videoDuration = 0;
    let deleteTarget = null;

    // ===== ZOOM STATE =====
    const ZOOM_STEP_FACTOR = 1.25;
    let pixelsPerSecond = 0;
    let ppsMin = 1;
    let ppsMax = 200;
    let isMouseOverTimeline = false;
    let lastMouseX = 0;
    let thumbnailDebounceTimer = null;

    // ===== VIDEO PLAYER =====
    const video = document.getElementById('videoPlayer');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const timestampEl = document.getElementById('timestamp');
    const playheadRuler = document.getElementById('playheadRuler');
    const tracksPlayhead = document.getElementById('tracksPlayhead');

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + s.toString().padStart(2, '0');
    }

    function formatTimeHMS(seconds) {
      if (isNaN(seconds)) return '00:00:00';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
    }

    function formatTimeMs(seconds) {
      if (isNaN(seconds)) return '0:00.000';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 1000);
      return m + ':' + s.toString().padStart(2, '0') + '.' + ms.toString().padStart(3, '0');
    }

    playBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', () => {
      const videoArea = document.querySelector('.video-area');
      if (videoArea.classList.contains('slide-main')) {
        videoArea.classList.remove('slide-main');
        if (typeof slideIsMainView !== 'undefined') slideIsMainView = false;
        return;
      }
      togglePlay();
    });

    function togglePlay() {
      if (video.paused) {
        video.play();
        playBtn.innerHTML = '&#9646;&#9646;';
      } else {
        video.pause();
        playBtn.innerHTML = '&#9654;';
      }
    }

    video.addEventListener('loadedmetadata', () => {
      videoDuration = video.duration;
      timestampEl.textContent = formatTime(0) + ' / ' + formatTime(videoDuration);
      ppsMin = computePpsMin();
      pixelsPerSecond = ppsMin;
      document.getElementById('zoomSlider').value = 0;
      applyZoom(pixelsPerSecond);
    });

    let rafId = null;
    video.addEventListener('timeupdate', () => {
      if (scrubberDragging) return;
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        if (scrubberDragging) return;
        const pct = (video.currentTime / videoDuration) * 100;
        progressFill.style.width = pct + '%';
        updateProgressChapterFills();
        timestampEl.textContent = formatTime(video.currentTime) + ' / ' + formatTime(videoDuration);
        updatePlayhead(pct);
        updatePlayerSlide();
      });
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      video.currentTime = pct * videoDuration;
      progressFill.style.width = (pct * 100) + '%';
      updateProgressChapterFills();
      positionPlayhead(pct * 100);
    });

    // Click on time ruler to seek
    document.getElementById('timeRuler').addEventListener('mousedown', (e) => {
      // Don't interfere if clicking the playhead handle itself
      if (e.target === playheadRuler || playheadRuler.contains(e.target)) return;
      seekFromRulerEvent(e);
    });

    function seekFromRulerEvent(e) {
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      video.currentTime = pct * videoDuration;
      positionPlayhead(pct * 100);
    }

    function positionPlayhead(pct) {
      const trackContent = document.getElementById('chapterTrackContent');
      const trackRect = trackContent.getBoundingClientRect();
      const px = (pct / 100) * trackRect.width;

      const ruler = document.getElementById('timeRuler');
      const rulerRect = ruler.getBoundingClientRect();
      const rulerLeft = trackRect.left - rulerRect.left + px;
      playheadRuler.style.left = rulerLeft + 'px';

      const tracks = document.getElementById('timelineTracks');
      const tracksRect = tracks.getBoundingClientRect();
      const tracksLeft = trackRect.left - tracksRect.left + px;
      tracksPlayhead.style.left = tracksLeft + 'px';

      document.getElementById('scrubberTooltip').textContent = scrubberDragging ? formatTimeMs(video.currentTime) : (videoDuration >= 3600 ? formatTimeHMS(video.currentTime) : formatTime(video.currentTime));
      updatePlayerSlide();
    }

    function updatePlayhead(pct) {
      if (scrubberDragging) return;
      positionPlayhead(pct);
    }

    function updatePlayheadImmediate(pct) {
      positionPlayhead(pct);
    }

    // ===== SCRUBBER DRAG =====
    let scrubberDragging = false;

    playheadRuler.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      scrubberDragging = true;
      playheadRuler.classList.add('dragging');
      tracksPlayhead.classList.add('dragging');
      video.pause();
      playBtn.innerHTML = '&#9654;';
      // Immediately seek to click position
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let newTime = pct * videoDuration;
      const snapped = findSnapTime(newTime, rect.width);
      if (snapped !== null) newTime = snapped;
      video.currentTime = newTime;
      const posPercent = (newTime / videoDuration) * 100;
      positionPlayhead(posPercent);
      document.getElementById('scrubberTooltip').textContent = formatTimeMs(newTime);
      document.addEventListener('mousemove', onScrubberMove);
      document.addEventListener('mouseup', onScrubberUp);
    });

    const SNAP_THRESHOLD_PX = 8;

    function getSnapPoints() {
      const points = [];
      data.chapters.forEach(ch => points.push(ch.time));
      data.slides.forEach(sl => points.push(sl.time));
      return [...new Set(points)].sort((a, b) => a - b);
    }

    function findSnapTime(time, trackWidth) {
      const snapPoints = getSnapPoints();
      const pxPerSec = trackWidth / videoDuration;
      for (const pt of snapPoints) {
        if (Math.abs(pt - time) * pxPerSec < SNAP_THRESHOLD_PX) {
          return pt;
        }
      }
      return null;
    }


    function onScrubberMove(e) {
      if (!scrubberDragging) return;
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let newTime = pct * videoDuration;

      const snappedTime = findSnapTime(newTime, rect.width);
      if (snappedTime !== null) {
        newTime = snappedTime;
      }

      video.currentTime = newTime;
      const actualPct = (newTime / videoDuration) * 100;
      positionPlayhead(actualPct);
      timestampEl.textContent = formatTime(newTime) + ' / ' + formatTime(videoDuration);
      progressFill.style.width = actualPct + '%';
      updateProgressChapterFills();
      document.getElementById('scrubberTooltip').textContent = formatTimeMs(newTime);
    }

    function onScrubberUp(e) {
      scrubberDragging = false;
      playheadRuler.classList.remove('dragging');
      tracksPlayhead.classList.remove('dragging');
      document.removeEventListener('mousemove', onScrubberMove);
      document.removeEventListener('mouseup', onScrubberUp);
    }

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (video.requestFullscreen) video.requestFullscreen();
    });

    // Click on timeline tracks area to position scrubber
    document.getElementById('timelineTracks').addEventListener('click', (e) => {
      if (e.target.closest('.chapter-segment') || e.target.closest('.slide-segment') || e.target.closest('.track-empty-text')) return;
      const trackContent = document.getElementById('chapterTrackContent');
      const rect = trackContent.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX > rect.right) return;
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let newTime = pct * videoDuration;
      const snapped = findSnapTime(newTime, rect.width);
      if (snapped !== null) newTime = snapped;
      video.currentTime = newTime;
      const posPercent = (newTime / videoDuration) * 100;
      positionPlayhead(posPercent);
    });

    document.getElementById('volumeBtn').addEventListener('click', () => {
      video.muted = !video.muted;
      document.getElementById('volumeBtn').innerHTML = video.muted ? '&#128263;' : '&#128266;';
    });

    // ===== TIME MARKS =====
    const NICE_INTERVALS = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600];

    function pickTickInterval() {
      const targetPx = 100;
      const idealInterval = targetPx / (pixelsPerSecond || 1);
      for (const interval of NICE_INTERVALS) {
        if (interval >= idealInterval * 0.7) return interval;
      }
      return NICE_INTERVALS[NICE_INTERVALS.length - 1];
    }

    function formatTimeMark(seconds) {
      if (seconds >= 3600) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return h + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
      }
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      if (pixelsPerSecond > 80 && seconds < 60) {
        return seconds.toFixed(1) + 's';
      }
      return m + ':' + s.toString().padStart(2, '0');
    }

    function renderTimeMarks() {
      const container = document.getElementById('timeMarks');
      container.innerHTML = '';
      if (!videoDuration || !pixelsPerSecond) return;

      const interval = pickTickInterval();
      const subDivisions = 5;
      const subInterval = interval / subDivisions;

      for (let t = 0; t <= videoDuration + 0.001; t += interval) {
        const x = t * pixelsPerSecond;
        const tick = document.createElement('div');
        tick.className = 'time-tick time-tick-major';
        tick.style.left = x + 'px';
        container.appendChild(tick);

        const label = document.createElement('span');
        label.className = 'time-mark';
        label.style.left = x + 'px';
        label.textContent = formatTimeMark(t);
        container.appendChild(label);

        for (let s = 1; s < subDivisions; s++) {
          const subT = t + s * subInterval;
          if (subT > videoDuration) break;
          const subX = subT * pixelsPerSecond;
          const subTick = document.createElement('div');
          subTick.className = 'time-tick time-tick-minor';
          subTick.style.left = subX + 'px';
          container.appendChild(subTick);
        }
      }

      // Update timeline grid lines
      const tracks = document.getElementById('timelineTracks');
      const gridSpacing = interval * pixelsPerSecond;
      tracks.style.backgroundImage = `repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent ${gridSpacing}px)`;
      tracks.style.backgroundPositionX = '56px';
      tracks.style.backgroundSize = `${gridSpacing}px 100%`;
    }

    // ===== ZOOM ENGINE =====
    function computePpsMin() {
      const timelineArea = document.querySelector('.timeline-area');
      const viewportWidth = timelineArea.clientWidth;
      const usableWidth = viewportWidth - 64 - 24;
      return Math.max(0.5, usableWidth / (videoDuration || 1));
    }

    function sliderToPps(value) {
      const logMin = Math.log(ppsMin);
      const logMax = Math.log(ppsMax);
      return Math.exp(logMin + value * (logMax - logMin));
    }

    function ppsToSlider(pps) {
      const logMin = Math.log(ppsMin);
      const logMax = Math.log(ppsMax);
      return Math.max(0, Math.min(1, (Math.log(pps) - logMin) / (logMax - logMin)));
    }

    function getZoomAnchor() {
      const timelineArea = document.querySelector('.timeline-area');
      const timelineAreaRect = timelineArea.getBoundingClientRect();
      if (isMouseOverTimeline && lastMouseX > 0) {
        const scrollX = timelineArea.scrollLeft;
        const mouseRelToContent = lastMouseX - timelineAreaRect.left + scrollX - 64;
        const time = Math.max(0, Math.min(videoDuration, mouseRelToContent / pixelsPerSecond));
        return { time, screenX: lastMouseX };
      }
      const playheadTime = video.currentTime;
      const pixelPos = playheadTime * pixelsPerSecond + 64;
      const screenX = pixelPos - timelineArea.scrollLeft + timelineAreaRect.left;
      return { time: playheadTime, screenX };
    }

    function applyZoom(newPps, anchorTime, anchorScreenX) {
      const timelineArea = document.querySelector('.timeline-area');
      newPps = Math.max(ppsMin, Math.min(ppsMax, newPps));
      pixelsPerSecond = newPps;

      const totalWidth = videoDuration * pixelsPerSecond;
      const timelineScrollable = document.getElementById('timelineScrollable');
      timelineScrollable.style.width = (totalWidth + 64 + 24) + 'px';
      timelineScrollable.style.minWidth = '100%';

      document.getElementById('zoomSlider').value = ppsToSlider(pixelsPerSecond);

      if (anchorTime !== undefined && anchorScreenX !== undefined) {
        const timelineAreaRect = timelineArea.getBoundingClientRect();
        const pixelPositionOfAnchor = anchorTime * pixelsPerSecond + 64;
        const desiredScrollLeft = pixelPositionOfAnchor - (anchorScreenX - timelineAreaRect.left);
        timelineArea.scrollLeft = Math.max(0, desiredScrollLeft);
      }

      renderTimeMarks();
      render();
      requestAnimationFrame(() => {
        const pct = (video.currentTime / (videoDuration || 1)) * 100;
        positionPlayhead(pct);
      });

      clearTimeout(thumbnailDebounceTimer);
      thumbnailDebounceTimer = setTimeout(generateVideoThumbnails, 250);
    }

    function zoomFit() {
      ppsMin = computePpsMin();
      pixelsPerSecond = ppsMin;
      const timelineArea = document.querySelector('.timeline-area');
      applyZoom(ppsMin);
      timelineArea.scrollLeft = 0;
    }

    function zoomIn(anchorTime, anchorScreenX) {
      applyZoom(pixelsPerSecond * ZOOM_STEP_FACTOR, anchorTime, anchorScreenX);
    }

    function zoomOut(anchorTime, anchorScreenX) {
      applyZoom(pixelsPerSecond / ZOOM_STEP_FACTOR, anchorTime, anchorScreenX);
    }

    function zoomToTimeRange(startTime, endTime) {
      const timelineArea = document.querySelector('.timeline-area');
      const viewportWidth = timelineArea.clientWidth;
      const usableWidth = viewportWidth - 64 - 24;
      const duration = Math.max(0.5, endTime - startTime);
      const targetPps = (usableWidth * 0.7) / duration;
      const clampedPps = Math.max(ppsMin, Math.min(ppsMax, targetPps));
      const midTime = (startTime + endTime) / 2;
      const centerScreenX = timelineArea.getBoundingClientRect().left + viewportWidth / 2;
      applyZoom(clampedPps, midTime, centerScreenX);
    }

    // Zoom event handlers
    document.getElementById('zoomFitBtn').addEventListener('click', zoomFit);

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      const anchor = getZoomAnchor();
      zoomIn(anchor.time, anchor.screenX);
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      const anchor = getZoomAnchor();
      zoomOut(anchor.time, anchor.screenX);
    });

    document.getElementById('zoomSlider').addEventListener('input', (e) => {
      const anchor = getZoomAnchor();
      const newPps = sliderToPps(parseFloat(e.target.value));
      applyZoom(newPps, anchor.time, anchor.screenX);
    });

    // Ctrl/Cmd + Mouse Wheel zoom
    const timelineAreaEl = document.querySelector('.timeline-area');
    timelineAreaEl.addEventListener('mouseenter', () => { isMouseOverTimeline = true; });
    timelineAreaEl.addEventListener('mouseleave', () => { isMouseOverTimeline = false; });
    timelineAreaEl.addEventListener('mousemove', (e) => { lastMouseX = e.clientX; });
    timelineAreaEl.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const factor = Math.pow(1.005, -e.deltaY);
        const anchor = getZoomAnchor();
        applyZoom(pixelsPerSecond * factor, anchor.time, anchor.screenX);
      }
    }, { passive: false });

    // ===== RENDER =====
    function render() {
      renderChapterTrack();
      renderSlideTrack();
      renderPanel();
      renderProgressSplits();
      updatePlayerSlide();
      const isEmpty = data.chapters.length === 0 && data.slides.length === 0;
    }

    function renderProgressSplits() {
      const bar = document.getElementById('progressBar');
      bar.querySelectorAll('.progress-chapter-seg').forEach(el => el.remove());
      if (videoDuration <= 0 || data.chapters.length <= 1) {
        bar.classList.remove('has-chapters');
        return;
      }
      bar.classList.add('has-chapters');
      for (let i = 0; i < data.chapters.length; i++) {
        const startTime = data.chapters[i].time;
        const endTime = i < data.chapters.length - 1 ? data.chapters[i + 1].time : videoDuration;
        const widthPct = ((endTime - startTime) / videoDuration) * 100;
        const seg = document.createElement('div');
        seg.className = 'progress-chapter-seg';
        seg.style.flex = '0 0 ' + widthPct + '%';
        seg.dataset.start = startTime;
        seg.dataset.end = endTime;
        seg.innerHTML = '<div class="progress-chapter-seg-fill"></div>';
        bar.appendChild(seg);
      }
      updateProgressChapterFills();
    }

    function updateProgressChapterFills() {
      const bar = document.getElementById('progressBar');
      if (!bar.classList.contains('has-chapters')) return;
      const currentTime = video.currentTime || 0;
      bar.querySelectorAll('.progress-chapter-seg').forEach(seg => {
        const start = parseFloat(seg.dataset.start);
        const end = parseFloat(seg.dataset.end);
        const fill = seg.querySelector('.progress-chapter-seg-fill');
        if (currentTime >= end) {
          fill.style.width = '100%';
        } else if (currentTime <= start) {
          fill.style.width = '0%';
        } else {
          const pct = ((currentTime - start) / (end - start)) * 100;
          fill.style.width = pct + '%';
        }
      });
    }

    function renderChapterTrack() {
      const container = document.getElementById('chapterTrackContent');
      container.innerHTML = '';
      container.setAttribute('role', 'list');
      container.setAttribute('aria-label', 'Chapter segments');

      if (data.chapters.length === 0) {
        container.removeAttribute('role');
        container.removeAttribute('aria-label');
        container.innerHTML = '<div class="track-empty"><div class="track-empty-text" id="emptyChapterClick">Click to add your first summary & chapter</div></div>';
        document.getElementById('emptyChapterClick').addEventListener('click', addChapter);
        return;
      }

      data.chapters.forEach((ch, i) => {
        if (i === 0 && ch.time !== 0) { ch.time = 0; }
        const nextTime = (i < data.chapters.length - 1) ? data.chapters[i + 1].time : videoDuration;
        const duration = nextTime - ch.time;
        const widthPx = duration * pixelsPerSecond;
        const el = document.createElement('div');
        el.className = 'chapter-segment' + (selectedItem && selectedItem.type === 'chapter' && selectedItem.index === i ? ' active' : '');
        el.style.width = widthPx + 'px';

        let handles = '';
        if (i > 0) handles += '<span class="resize-handle left" data-side="left"></span>';
        if (i < data.chapters.length - 1) handles += '<span class="resize-handle right" data-side="right"></span>';
        el.innerHTML = handles + '<span class="segment-title">' + formatTime(ch.time) + ' — ' + ch.title + '</span><span class="segment-duration">' + formatTime(duration) + '</span>';

        el.setAttribute('data-tooltip', 'Chapter: ' + ch.title);
        el.setAttribute('role', 'listitem');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', 'Chapter: ' + ch.title + ' at ' + formatTime(ch.time));
        el.setAttribute('aria-roledescription', 'resizable chapter');
        el.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('resize-handle')) {
            initResize(e, 'chapter', i, e.target.dataset.side);
          } else {
            initDrag(e, 'chapter', i);
          }
        });
        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const startT = ch.time;
          const endT = (i < data.chapters.length - 1) ? data.chapters[i + 1].time : videoDuration;
          zoomToTimeRange(startT, endT);
        });
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          selectItem('chapter', i);
          showTimelineContextMenu(e.clientX, e.clientY, 'chapter', i);
        });
        el.addEventListener('keydown', (e) => {
          if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); selectItem('chapter', i); }
        });
        container.appendChild(el);
      });
    }

    function renderSlideTrack() {
      const container = document.getElementById('slideTrackContent');
      container.innerHTML = '';
      container.setAttribute('role', 'list');
      container.setAttribute('aria-label', 'Slide segments');

      if (data.slides.length === 0) {
        container.removeAttribute('role');
        container.removeAttribute('aria-label');
        container.innerHTML = '<div class="track-empty"><label class="track-empty-text" id="emptySlideClick" for="slideFileInput" style="cursor:pointer;">Drag and drop or click to add slides</label></div>';
        return;
      }

      const dur = videoDuration || 1;
      data.slides.forEach((sl, i) => {
        const nextTime = (i < data.slides.length - 1) ? data.slides[i + 1].time : dur;
        const duration = nextTime - sl.time;
        const widthPx = duration * pixelsPerSecond;
        const el = document.createElement('div');
        el.className = 'slide-segment' + (selectedItem && selectedItem.type === 'slide' && selectedItem.index === i ? ' active' : '');
        el.style.width = widthPx + 'px';
        if (i === 0 && sl.time > 0) {
          el.style.marginLeft = (sl.time * pixelsPerSecond) + 'px';
        }
        el.setAttribute('data-tooltip', 'Slide: ' + sl.title);
        el.setAttribute('role', 'listitem');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', 'Slide: ' + sl.title + ' at ' + formatTime(sl.time));
        el.setAttribute('aria-roledescription', 'resizable slide');

        let handles = '<span class="resize-handle left" data-side="left"></span>';
        if (i < data.slides.length - 1) handles += '<span class="resize-handle right" data-side="right"></span>';
        el.innerHTML = handles +
          (sl.image ? '<img class="slide-segment-thumb" src="' + sl.image + '" alt="' + sl.title + ' thumbnail" draggable="false">' : '') +
          '<span class="slide-segment-label">' + formatTime(sl.time) + ' — ' + sl.title + '</span>' +
          '<span class="segment-duration">' + formatTime(duration) + '</span>';

        el.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('resize-handle')) {
            initResize(e, 'slide', i, e.target.dataset.side);
          } else {
            initDrag(e, 'slide', i);
          }
        });
        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const startT = sl.time;
          const endT = (i < data.slides.length - 1) ? data.slides[i + 1].time : videoDuration;
          zoomToTimeRange(startT, endT);
        });
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          selectItem('slide', i);
          showTimelineContextMenu(e.clientX, e.clientY, 'slide', i);
        });
        el.addEventListener('keydown', (e) => {
          if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); selectItem('slide', i); }
        });
        container.appendChild(el);
      });
    }

    function parseTime(str) {
      const parts = str.trim().split(':');
      if (parts.length === 2) {
        const m = parseInt(parts[0]) || 0;
        const s = parseInt(parts[1]) || 0;
        return m * 60 + s;
      }
      if (parts.length === 3) {
        const h = parseInt(parts[0]) || 0;
        const m = parseInt(parts[1]) || 0;
        const s = parseInt(parts[2]) || 0;
        return h * 3600 + m * 60 + s;
      }
      return null;
    }

    function bindIntroPanelEvents() {

          if (charCount) charCount.textContent = e.target.value.length + '/500';
          triggerSave();
        });
      }
      const deleteBtn = document.getElementById('introDeleteBtn');
      if (deleteBtn) deleteBtn.addEventListener('click', () => {
        data.introduction.text = '';
        selectedItem = null;
        render();
        triggerSave();
        showToast('Introduction deleted');
      });
    }

    function bindPanelEvents() {
      document.querySelectorAll('.use-current-btn').forEach(btn => {

      document.querySelectorAll('.accordion-delete-btn').forEach(btn => {

          }

        });

      // Form inputs
      const introText = document.getElementById('introTextInput');
      if (introText) introText.addEventListener('input', (e) => { data.introduction.text = e.target.value; triggerSave(); });

      const chTitle = document.getElementById('chapterTitleInput');
      if (chTitle) {
        chTitle.addEventListener('input', (e) => {
          if (e.target.value.trim()) {
            data.chapters[selectedItem.index].title = e.target.value;

          }

        chTitle.addEventListener('blur', (e) => {
          if (!e.target.value.trim()) e.target.value = data.chapters[selectedItem.index].title;

      const chSummary = document.getElementById('chapterSummaryInput');
      if (chSummary) chSummary.addEventListener('input', (e) => { data.chapters[selectedItem.index].summary = e.target.value; triggerSave(); });

      // Chapter timestamp auto-save
      const chTime = document.getElementById('chapterTimeInput');
      if (chTime) chTime.addEventListener('change', (e) => {
        const seconds = parseTime(e.target.value);
        if (seconds !== null && seconds >= 0 && seconds <= videoDuration) {
          data.chapters[selectedItem.index].time = seconds;
          data.chapters.sort((a, b) => a.time - b.time);
          const item = data.chapters.find(c => c.time === seconds);
          selectedItem.index = data.chapters.indexOf(item);
          video.currentTime = seconds;
          render();
          triggerSave();
        } else {
          e.target.value = formatTime(data.chapters[selectedItem.index].time);
        }
      });

      const slTitle = document.getElementById('slideTitleInput');
      if (slTitle) {
        slTitle.addEventListener('input', (e) => {
          if (e.target.value.trim()) {
            data.slides[selectedItem.index].title = e.target.value;

    // ===== SELECTION =====
    function selectItem(type, index) {
      selectedItem = { type, index };
      // Switch panel filter to show the selected item's type
      if (type === 'intro' && panelFilter !== 'all' && panelFilter !== 'intro') {
        panelFilter = 'intro';
        updateSidebarActive();
      } else if (type === 'chapter' && panelFilter !== 'all' && panelFilter !== 'chapters') {
        panelFilter = 'chapters';
        updateSidebarActive();
      } else if (type === 'slide' && panelFilter !== 'all' && panelFilter !== 'slides') {
        panelFilter = 'slides';
        updateSidebarActive();
      }
      render();
      if (type === 'chapter' && data.chapters[index]) {
        video.currentTime = data.chapters[index].time;
      } else if (type === 'slide' && data.slides[index]) {
        video.currentTime = data.slides[index].time;
      }
    }

    function updateSidebarActive() {
      document.querySelectorAll('.panel-tab').forEach(b => {
        b.classList.toggle('active', b.dataset.panel === panelFilter);
      });
    }

    // ===== ADD CHAPTER =====
    function findAvailableTime(requestedTime, existingTimes) {
      const time = Math.round(requestedTime * 10) / 10;
      const tooClose = existingTimes.some(t => Math.abs(t - time) < 0.5);
      if (!tooClose) return time;
      const maxTime = videoDuration;
      for (let offset = 1; offset <= Math.ceil(maxTime); offset++) {
        const forward = Math.round((time + offset) * 10) / 10;
        if (forward <= maxTime && !existingTimes.some(t => Math.abs(t - forward) < 0.5)) return forward;
      }
      return null;
    }

    function addChapter() {
      let time;
      if (data.chapters.length === 0) {
        time = 0;
      } else {
        time = video.currentTime || 0;
        const existingChapterTimes = data.chapters.map(c => c.time);
        const rounded = Math.round(time * 10) / 10;
        const tooClose = existingChapterTimes.some(t => Math.abs(t - rounded) < 0.5);

        if (!tooClose) {
          time = rounded;
        } else {
          // Snap to slide positions on the other timeline first
          let placed = false;
          if (data.slides.length > 0) {
            const sortedSlides = [...data.slides].sort((a, b) => a.time - b.time);
            for (const slide of sortedSlides) {
              const sTime = Math.round(slide.time * 10) / 10;
              if (sTime >= rounded && !existingChapterTimes.some(t => Math.abs(t - sTime) < 0.5)) {
                time = sTime;
                placed = true;
                break;
              }
            }
          }
          // Then try 2s gaps forward from current time
          if (!placed) {
            let candidate = rounded;
            while (candidate <= videoDuration) {
              candidate = Math.round((candidate + 2) * 10) / 10;
              if (candidate <= videoDuration && !existingChapterTimes.some(t => Math.abs(t - candidate) < 0.5)) {
                time = candidate;
                placed = true;
                break;
              }
            }
          }
          if (!placed) {
            showToast('No more room — timeline is full');
            return;
          }
        }
      }
      const newChapter = { time, title: 'Untitled chapter', summary: '', ai: false };
      data.chapters.push(newChapter);
      data.chapters.sort((a, b) => a.time - b.time);
      const newIndex = data.chapters.indexOf(newChapter);
      selectedItem = { type: 'chapter', index: newIndex };
      panelFilter = 'chapters';
      updateSidebarActive();
      render();
      triggerSave();
      showToast('Chapter added at ' + formatTime(time));
    }

    // ===== ADD SLIDES (PDF upload from desktop) =====
    async function handlePdfUpload(file) {
      if (typeof pdfjsLib === 'undefined') {
        showToast('PDF library loading, please try again...');
        return;
      }
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;
        const dur = videoDuration || 1;
        const interval = dur / totalPages;
        const deckName = file.name.replace(/\.[^.]+$/, '');

        showToast('Extracting ' + totalPages + ' slides from PDF...');

        for (let p = 1; p <= totalPages; p++) {
          const page = await pdf.getPage(p);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          const image = canvas.toDataURL('image/png');
          const time = (data.slides.length === 0 && p === 1) ? 0 : interval * (p - 1);
          data.slides.push({ time, title: deckName + ' - Slide ' + p, description: '', image });
        }

        data.slides.sort((a, b) => a.time - b.time);
        selectedItem = { type: 'slide', index: 0 };
        panelFilter = 'slides';
        updateSidebarActive();
        render();
        triggerSave();
        showToast(totalPages + ' slides added from ' + file.name);
      } catch (err) {
        showToast('Error reading PDF: ' + err.message);
      }
    }

    // ===== UNDO/REDO =====
    const history = [];
    let historyIndex = -1;
    const MAX_HISTORY = 50;

    function pushHistory() {
      const snapshot = JSON.stringify({ data, selectedItem });
      if (historyIndex >= 0 && history[historyIndex] === snapshot) return;
      history.splice(historyIndex + 1);
      history.push(snapshot);
      if (history.length > MAX_HISTORY) history.shift();
      historyIndex = history.length - 1;
    }

    function undo() {
      if (historyIndex <= 0) { showToast('Nothing to undo'); return; }
      historyIndex--;
      restoreSnapshot(history[historyIndex]);
      showToast('Undo');
    }

    function redo() {
      if (historyIndex >= history.length - 1) { showToast('Nothing to redo'); return; }
      historyIndex++;
      restoreSnapshot(history[historyIndex]);
      showToast('Redo');
    }

    function restoreSnapshot(snapshot) {
      const state = JSON.parse(snapshot);
      data = state.data;
      selectedItem = state.selectedItem;
      render();
      triggerSaveUI();
    }

    // ===== KEYBOARD =====
    document.addEventListener('keydown', (e) => {
      // Undo/Redo works everywhere
      if ((e.metaKey || e.ctrlKey) && e.code === 'KeyZ') {
        e.preventDefault();
        if (e.shiftKey) { redo(); } else { undo(); }
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.code === 'KeyY') {
        e.preventDefault();
        redo();
        return;
      }

      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      // Keyboard reorder of selected segment (swap with neighbor, preserve durations)
      if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && selectedItem
          && (selectedItem.type === 'chapter' || selectedItem.type === 'slide')
          && document.activeElement
          && (document.activeElement.classList.contains('chapter-segment') || document.activeElement.classList.contains('slide-segment'))) {
        e.preventDefault();
        const direction = e.code === 'ArrowLeft' ? -1 : 1;
        const arr = selectedItem.type === 'chapter' ? data.chapters : data.slides;
        const idx = selectedItem.index;
        const swapIdx = idx + direction;
        if (swapIdx < 0 || swapIdx >= arr.length) return;

        pushHistory();
        const durations = getSegmentDurations(selectedItem.type);
        // Swap item and duration
        [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
        [durations[idx], durations[swapIdx]] = [durations[swapIdx], durations[idx]];
        rebuildTimesFromDurations(selectedItem.type, durations);

        selectedItem.index = swapIdx;
        render();
        triggerSaveUI();
        announce((selectedItem.type === 'chapter' ? 'Chapter' : 'Slide') + ' moved to position ' + (swapIdx + 1));
        const segments = document.querySelectorAll('.' + selectedItem.type + '-segment');
        if (segments[swapIdx]) segments[swapIdx].focus();
        return;
      }

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
      if (e.code === 'ArrowLeft') {
        video.currentTime = Math.max(0, video.currentTime - 5);
      }
      if (e.code === 'ArrowRight') {
        video.currentTime = Math.min(videoDuration, video.currentTime + 5);
      }
      if (e.code === 'Delete' || e.code === 'Backspace') {
        if (selectedItem && (selectedItem.type === 'chapter' || selectedItem.type === 'slide')) {
          confirmDelete();
        }
      }
      if (e.code === 'Escape') {
        document.getElementById('deleteModal').classList.remove('visible');
        document.getElementById('previewOverlay').classList.remove('visible');
      }
      if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        const anchor = getZoomAnchor();
        zoomIn(anchor.time, anchor.screenX);
      }
      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        const anchor = getZoomAnchor();
        zoomOut(anchor.time, anchor.screenX);
      }
      if (e.key === '0') {
        e.preventDefault();
        zoomFit();
      }
    });

    // ===== VIDEO THUMBNAILS =====
    let thumbnailsGenerated = false;

    function generateVideoThumbnails() {
      thumbnailsGenerated = true;

      const canvas = document.getElementById('videoThumbnails');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('videoTrackContent');
      const containerWidth = Math.max(200, container.offsetWidth);
      const thumbCellWidth = 64;
      const thumbCount = Math.min(100, Math.max(5, Math.ceil(containerWidth / thumbCellWidth)));
      const thumbWidth = Math.ceil(containerWidth / thumbCount);
      const thumbHeight = 40;

      canvas.width = containerWidth;
      canvas.height = thumbHeight;

      // Create a dedicated offscreen video for thumbnail extraction
      const thumbVideo = document.createElement('video');
      thumbVideo.muted = true;
      thumbVideo.preload = 'auto';
      thumbVideo.playsInline = true;
      // Use the same source as main video, no crossOrigin for local files
      thumbVideo.src = document.querySelector('#videoPlayer source').src;

      let captured = 0;

      thumbVideo.addEventListener('loadeddata', () => {
        seekNext();
      });

      function seekNext() {
        if (captured >= thumbCount) {
          thumbVideo.remove();
          return;
        }
        const t = (videoDuration / thumbCount) * captured + 0.1;
        thumbVideo.currentTime = Math.min(t, videoDuration - 0.5);
      }

      thumbVideo.addEventListener('seeked', () => {
        try {
          const x = captured * thumbWidth;
          ctx.drawImage(thumbVideo, x, 0, thumbWidth, thumbHeight);
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(x, 0, 1, thumbHeight);
        } catch (e) {
          // If drawImage fails due to security, draw colored placeholder
          const x = captured * thumbWidth;
          const hue = (captured / thumbCount) * 40 + 200;
          ctx.fillStyle = `hsl(${hue}, 30%, ${15 + (captured % 2) * 5}%)`;
          ctx.fillRect(x, 0, thumbWidth, thumbHeight);
        }
        captured++;
        setTimeout(seekNext, 50);
      });
    }

    // ===== DRAG & DROP (reorder — preserves duration) =====
    let dragState = null;

    function getSegmentDurations(type) {
      const arr = type === 'chapter' ? data.chapters : data.slides;
      const dur = videoDuration || 1;
      return arr.map((item, i) => {
        const nextTime = (i < arr.length - 1) ? arr[i + 1].time : dur;
        return nextTime - item.time;
      });
    }

    function rebuildTimesFromDurations(type, durations) {
      const arr = type === 'chapter' ? data.chapters : data.slides;
      let t = 0;
      for (let i = 0; i < arr.length; i++) {
        arr[i].time = t;
        t += durations[i];
      }
    }

    function initDrag(e, type, index) {
      if (e.button !== 0) return;
      e.preventDefault();

      const trackContent = type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const timelineArea = document.querySelector('.timeline-area');

      const durations = getSegmentDurations(type);

      dragState = {
        type,
        index,
        trackRect: rect,
        startX: e.clientX,
        moved: false,
        indicator: null,
        indicatorLabel: null,
        scrollLeft: timelineArea.scrollLeft,
        lastClientX: e.clientX,
        lastClientY: e.clientY,
        element: e.currentTarget,
        autoScrollRAF: null,
        originalDurations: durations,
        targetInsertIdx: index
      };

      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
    }

    // -- Ghost thumbnail --
    function createDragGhost(segmentEl) {
      const ghost = document.getElementById('dragGhost');
      // Clone content without resize handles
      const clone = segmentEl.cloneNode(true);
      clone.querySelectorAll('.resize-handle').forEach(h => h.remove());
      ghost.innerHTML = clone.innerHTML;
      ghost.style.width = Math.min(200, segmentEl.offsetWidth) + 'px';
      ghost.style.height = segmentEl.offsetHeight + 'px';
      ghost.style.background = getComputedStyle(segmentEl).background;
      ghost.classList.add('visible');
    }

    function updateGhostPosition(clientX, clientY) {
      const ghost = document.getElementById('dragGhost');
      ghost.style.left = (clientX - ghost.offsetWidth / 2) + 'px';
      ghost.style.top = (clientY - ghost.offsetHeight - 16) + 'px';
    }

    function removeDragGhost() {
      const ghost = document.getElementById('dragGhost');
      ghost.classList.remove('visible');
      setTimeout(() => { ghost.innerHTML = ''; }, 150);
    }

    // -- Snap logic --
    function getSnapTargets(type) {
      const targets = [0, videoDuration, video.currentTime];
      data.chapters.forEach((ch, i) => {
        if (type === 'chapter' && i === dragState.index) return;
        targets.push(ch.time);
      });
      data.slides.forEach((sl, i) => {
        if (type === 'slide' && i === dragState.index) return;
        targets.push(sl.time);
      });
      return targets;
    }

    function applySnap(rawTime, targets) {
      const threshold = 10 / pixelsPerSecond;
      let closest = null;
      let closestDist = Infinity;
      for (let i = 0; i < targets.length; i++) {
        const dist = Math.abs(rawTime - targets[i]);
        if (dist < threshold && dist < closestDist) {
          closest = targets[i];
          closestDist = dist;
        }
      }
      return closest !== null ? { time: closest, snapped: true } : { time: rawTime, snapped: false };
    }

    function showSnapLine(timePx) {
      const snapLine = document.getElementById('snapLine');
      snapLine.style.left = timePx + 'px';
      snapLine.classList.add('active');
    }

    function hideSnapLine() {
      document.getElementById('snapLine').classList.remove('active');
    }

    // -- Auto-scroll --
    function startAutoScroll() {
      if (dragState.autoScrollRAF) return;
      autoScrollFrame();
    }

    function autoScrollFrame() {
      if (!dragState || !dragState.moved) return;
      const timelineArea = document.querySelector('.timeline-area');
      const areaRect = timelineArea.getBoundingClientRect();
      const cursorX = dragState.lastClientX;
      const edgeZone = 60;

      let scrollDelta = 0;
      if (cursorX < areaRect.left + edgeZone) {
        scrollDelta = -((areaRect.left + edgeZone - cursorX) / edgeZone) * 8;
      } else if (cursorX > areaRect.right - edgeZone) {
        scrollDelta = ((cursorX - (areaRect.right - edgeZone)) / edgeZone) * 8;
      }

      if (scrollDelta !== 0) {
        timelineArea.scrollLeft += scrollDelta;
        updateDragPosition(dragState.lastClientX);
      }

      dragState.autoScrollRAF = requestAnimationFrame(autoScrollFrame);
    }

    function stopAutoScroll() {
      if (dragState && dragState.autoScrollRAF) {
        cancelAnimationFrame(dragState.autoScrollRAF);
        dragState.autoScrollRAF = null;
      }
    }

    // -- Core position update (used by both mousemove and auto-scroll) --
    function updateDragPosition(clientX) {
      if (!dragState || !dragState.moved) return;

      const trackContent = dragState.type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();
      dragState.trackRect = rect;

      const relX = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const cursorTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

      // Determine target insertion index based on cursor position over segments
      const arr = dragState.type === 'chapter' ? data.chapters : data.slides;
      const durations = dragState.originalDurations;
      let targetIdx = 0;

      // Walk through segment boundaries (excluding dragged) to find where cursor lands
      let accTime = 0;
      let otherIdx = 0;
      for (let i = 0; i < arr.length; i++) {
        if (i === dragState.index) continue;
        const segEnd = accTime + durations[i];
        const midpoint = accTime + durations[i] / 2;
        if (cursorTime > midpoint) {
          targetIdx = otherIdx + 1;
        }
        accTime = segEnd;
        otherIdx++;
      }
      dragState.targetInsertIdx = targetIdx;

      // Calculate the pixel position of the insertion point
      let insertPx = 0;
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (i === dragState.index) continue;
        if (count === targetIdx) break;
        insertPx += durations[i] * pixelsPerSecond;
        count++;
      }

      // Snap indicator
      const snapTargets = getSnapTargets(dragState.type);
      const snapResult = applySnap(cursorTime, snapTargets);
      if (snapResult.snapped) {
        showSnapLine(snapResult.time * pixelsPerSecond);
      } else {
        hideSnapLine();
      }

      // Apply gap classes to segments
      const draggedWidth = dragState.originalDurations[dragState.index] * pixelsPerSecond;
      const segments = trackContent.querySelectorAll('.' + dragState.type + '-segment');
      segments.forEach((seg, i) => {
        seg.classList.toggle('dragging', i === dragState.index);
        seg.classList.remove('gap-before', 'gap-after');
        seg.style.marginLeft = '';
        seg.style.marginRight = '';
      });

      // Open gap at insertion point equal to dragged segment width
      let segCount = 0;
      for (let i = 0; i < segments.length; i++) {
        if (i === dragState.index) continue;
        if (segCount === targetIdx - 1 && targetIdx > 0) {
          segments[i].classList.add('gap-after');
          segments[i].style.marginRight = draggedWidth + 'px';
        } else if (segCount === targetIdx && targetIdx === 0) {
          segments[i].classList.add('gap-before');
          segments[i].style.marginLeft = draggedWidth + 'px';
        }
        segCount++;
      }

      // Position ghost placeholder in the gap — clamp within timeline bounds
      const maxPx = videoDuration * pixelsPerSecond;
      const clampedInsertPx = Math.max(0, Math.min(insertPx, maxPx - draggedWidth));
      const clampedWidth = Math.min(draggedWidth, maxPx - clampedInsertPx);

      if (!dragState.indicator) {
        dragState.indicator = document.createElement('div');
        dragState.indicator.className = 'drag-ghost-placeholder';
        const content = document.createElement('div');
        content.className = 'drag-ghost-placeholder-content';
        dragState.indicator.appendChild(content);
        trackContent.appendChild(dragState.indicator);
      }
      dragState.indicator.style.left = clampedInsertPx + 'px';
      dragState.indicator.style.width = clampedWidth + 'px';
      const insertTime = clampedInsertPx / pixelsPerSecond;
      const segName = (dragState.type === 'chapter' ? data.chapters : data.slides)[dragState.index].title;
      dragState.indicator.querySelector('.drag-ghost-placeholder-content').textContent = formatTime(insertTime) + ' · ' + segName;
    }

    function onDragMove(e) {
      if (!dragState) return;

      const dx = Math.abs(e.clientX - dragState.startX);
      if (dx < 10 && !dragState.moved) return;

      if (!dragState.moved) {
        dragState.moved = true;
        document.body.classList.add('is-dragging');
        pushHistory();
        createDragGhost(dragState.element);
        announce('Dragging ' + dragState.type + '. Drop to reposition.');

        const track = dragState.type === 'chapter'
          ? document.getElementById('chapterTrack')
          : document.getElementById('slideTrack');
        track.classList.add('drop-target-active');

        // Collapse the dragged segment visually
        const segments = track.querySelectorAll('.' + dragState.type + '-segment');
        if (segments[dragState.index]) {
          segments[dragState.index].classList.add('dragging');
        }

        startAutoScroll();
      }

      dragState.lastClientX = e.clientX;
      dragState.lastClientY = e.clientY;

      updateGhostPosition(e.clientX, e.clientY);
      updateDragPosition(e.clientX);
    }

    function onDragEnd(e) {
      if (!dragState) return;

      document.body.classList.remove('is-dragging');
      stopAutoScroll();
      removeDragGhost();
      hideSnapLine();

      if (dragState.indicator) {
        dragState.indicator.remove();
      }

      // Clean up gap margins
      document.querySelectorAll('.gap-before, .gap-after').forEach(seg => {
        seg.classList.remove('gap-before', 'gap-after');
        seg.style.marginLeft = '';
        seg.style.marginRight = '';
      });

      document.querySelectorAll('.track').forEach(t => t.classList.remove('drop-target-active'));

      if (!dragState.moved) {
        selectItem(dragState.type, dragState.index);
      } else {
        const arr = dragState.type === 'chapter' ? data.chapters : data.slides;
        const item = arr[dragState.index];
        const originalIndex = dragState.index;

        // Calculate target insert position from cursor
        const trackContent = dragState.type === 'chapter'
          ? document.getElementById('chapterTrackContent')
          : document.getElementById('slideTrackContent');
        const rect = trackContent.getBoundingClientRect();
        const relX = Math.max(0, Math.min(dragState.lastClientX - rect.left, rect.width));
        const dropTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

        // Find target index based on drop position
        let targetIdx = arr.length;
        for (let i = 0; i < arr.length; i++) {
          if (i === originalIndex) continue;
          if (dropTime < arr[i].time) { targetIdx = i; break; }
        }

        // Store original durations before reordering
        const durations = arr.map((a, i) => {
          const nextTime = (i < arr.length - 1) ? arr[i + 1].time : videoDuration;
          return nextTime - a.time;
        });
        const itemDuration = durations[originalIndex];

        // Remove item from original position
        arr.splice(originalIndex, 1);
        durations.splice(originalIndex, 1);

        // Adjust target index after removal
        const insertIdx = targetIdx > originalIndex ? targetIdx - 1 : targetIdx;

        // Insert item at new position
        arr.splice(insertIdx, 0, item);
        durations.splice(insertIdx, 0, itemDuration);

        // Recalculate times from durations (preserves all durations)
        if (dragState.type === 'chapter') {
          let t = 0;
          arr.forEach((a, i) => { a.time = Math.round(t * 10) / 10; t += durations[i]; });
        } else {
          // For slides: preserve relative spacing — use drop time for the moved item
          item.time = Math.round(dropTime * 10) / 10;
          arr.sort((a, b) => a.time - b.time);
        }

        const newIndex = arr.indexOf(item);
        selectedItem = { type: dragState.type, index: newIndex };
        render();
        triggerSave();
        showToast('"' + item.title + '" moved to ' + formatTime(item.time));
      }

      dragState = null;
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
    }

    // ===== RESIZE HANDLES =====
    let resizeState = null;
    const MIN_SEGMENT_DURATION = 1;

    function initResize(e, type, index, side) {
      if (e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();

      const trackContent = type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();

      resizeState = {
        type,
        index,
        side,
        startX: e.clientX,
        trackRect: rect,
        moved: false
      };

      document.addEventListener('mousemove', onResizeMove);
      document.addEventListener('mouseup', onResizeEnd);
    }

    function onResizeMove(e) {
      if (!resizeState) return;

      const dx = Math.abs(e.clientX - resizeState.startX);
      if (dx < 3 && !resizeState.moved) return;

      if (!resizeState.moved) {
        resizeState.moved = true;
        document.body.classList.add('is-resizing');
        pushHistory();
      }

      const trackContent = resizeState.type === 'chapter'
        ? document.getElementById('chapterTrackContent')
        : document.getElementById('slideTrackContent');
      const rect = trackContent.getBoundingClientRect();
      const relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const rawTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

      const arr = resizeState.type === 'chapter' ? data.chapters : data.slides;
      const i = resizeState.index;

      // Snap to playhead (same magnet effect as scrubber dragging)
      const snapTargets = getSnapTargets(resizeState.type);
      const snapResult = applySnap(rawTime, snapTargets);
      let snappedTime = snapResult.snapped ? snapResult.time : rawTime;

      if (snapResult.snapped) {
        showSnapLine(snapResult.time * pixelsPerSecond);
      } else {
        hideSnapLine();
      }

      if (resizeState.side === 'left') {
        const prevTime = (i > 0) ? arr[i - 1].time + MIN_SEGMENT_DURATION : 0;
        const nextBound = (i < arr.length - 1) ? arr[i + 1].time - MIN_SEGMENT_DURATION : videoDuration - MIN_SEGMENT_DURATION;
        const maxTime = Math.min(nextBound, videoDuration - MIN_SEGMENT_DURATION);
        arr[i].time = Math.max(prevTime, Math.min(maxTime, snappedTime));
      } else {
        const thisStart = arr[i].time + MIN_SEGMENT_DURATION;
        const nextEnd = (i + 2 < arr.length) ? arr[i + 2].time - MIN_SEGMENT_DURATION : videoDuration - MIN_SEGMENT_DURATION;
        arr[i + 1].time = Math.max(thisStart, Math.min(nextEnd, snappedTime));
      }

      renderChapterTrack();
      renderSlideTrack();
    }

    function onResizeEnd(e) {
      if (!resizeState) return;

      document.body.classList.remove('is-resizing');
      hideSnapLine();

      if (resizeState.moved) {
        render();
        triggerSave();
        showToast('Segment boundary adjusted');
      }

      resizeState = null;
      document.removeEventListener('mousemove', onResizeMove);
      document.removeEventListener('mouseup', onResizeEnd);
    }

    // ===== EXTERNAL FILE DROP =====
    function initExternalDrop() {
      const slideTrack = document.getElementById('slideTrack');
      let dropOverlay = null;
      let dropIndicator = null;
      let enterCount = 0;

      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('drop', (e) => {
        if (!e.target.closest('#slideTrack')) e.preventDefault();
      });

      slideTrack.addEventListener('dragenter', (e) => {
        if (!e.dataTransfer.types.includes('Files')) return;
        enterCount++;
        e.preventDefault();
        if (!dropOverlay) {
          dropOverlay = document.createElement('div');
          dropOverlay.className = 'drop-zone-overlay visible';
          dropOverlay.innerHTML = '<span class="drop-zone-overlay-text">Drop slide deck or image to add slides</span>';
          slideTrack.style.position = 'relative';
          slideTrack.appendChild(dropOverlay);
        }
        announce('Drop zone active. Drop slide deck or image file to add slides.');
      });

      slideTrack.addEventListener('dragover', (e) => {
        if (!e.dataTransfer.types.includes('Files')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';

        if (!dropIndicator) {
          dropIndicator = document.createElement('div');
          dropIndicator.className = 'drag-indicator';
          const label = document.createElement('span');
          label.className = 'drag-indicator-label';
          dropIndicator.appendChild(label);
          const trackContent = document.getElementById('slideTrackContent');
          trackContent.appendChild(dropIndicator);
        }
        const trackContent = document.getElementById('slideTrackContent');
        const rect = trackContent.getBoundingClientRect();
        const relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const time = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));
        dropIndicator.style.left = (time * pixelsPerSecond) + 'px';
        dropIndicator.querySelector('.drag-indicator-label').textContent = formatTime(time);
      });

      slideTrack.addEventListener('dragleave', (e) => {
        enterCount--;
        if (enterCount <= 0) {
          enterCount = 0;
          if (dropOverlay) { dropOverlay.remove(); dropOverlay = null; }
          if (dropIndicator) { dropIndicator.remove(); dropIndicator = null; }
        }
      });

      slideTrack.addEventListener('drop', (e) => {
        e.preventDefault();
        enterCount = 0;
        if (dropOverlay) { dropOverlay.remove(); dropOverlay = null; }
        if (dropIndicator) { dropIndicator.remove(); dropIndicator = null; }

        const allFiles = Array.from(e.dataTransfer.files);
        const imageFiles = allFiles.filter(f => f.type.startsWith('image/'));
        const deckExtensions = ['.ppt', '.pptx', '.pdf', '.key'];
        const deckFiles = allFiles.filter(f => deckExtensions.some(ext => f.name.toLowerCase().endsWith(ext)));

        if (imageFiles.length === 0 && deckFiles.length === 0) {
          showToast('Drop image files or slide decks (PPT, PPTX, PDF)');
          return;
        }

        const trackContent = document.getElementById('slideTrackContent');
        const rect = trackContent.getBoundingClientRect();
        const relX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const dropTime = Math.max(0, Math.min(videoDuration, relX / pixelsPerSecond));

        pushHistory();

        if (deckFiles.length > 0) {
          const file = deckFiles[0];
          const deckName = file.name.replace(/\.[^.]+$/, '');

          // Place slides at chapter boundaries if chapters exist
          let slideTimes = [];
          if (data.chapters.length > 0) {
            slideTimes = data.chapters.map(ch => ch.time);
          } else {
            // No chapters — distribute evenly across video
            const slideCount = 5;
            const spacing = videoDuration / (slideCount + 1);
            for (let i = 0; i < slideCount; i++) {
              slideTimes.push(Math.round((dropTime + i * spacing) * 10) / 10);
            }
          }

          // Read file to use as thumbnail source for PDF, or use placeholders
          const isPdf = file.name.toLowerCase().endsWith('.pdf');
          if (isPdf && typeof pdfjsLib !== 'undefined') {
            // PDF.js available — render pages (future enhancement)
            addDeckSlides(slideTimes, deckName, null);
          } else {
            addDeckSlides(slideTimes, deckName, file);
          }
          return;
        }

        function addDeckSlides(times, deckName, file) {
          const existingSlideTimes = data.slides.map(s => Math.round(s.time * 10) / 10);
          let added = 0;
          times.forEach((t, i) => {
            const rounded = Math.round(t * 10) / 10;
            if (existingSlideTimes.includes(rounded)) return;
            data.slides.push({ time: rounded, title: deckName + ' - Slide ' + (i + 1), description: '', image: '', deckFile: file ? file.name : null });
            existingSlideTimes.push(rounded);
            added++;
          });
          data.slides.sort((a, b) => a.time - b.time);
          panelFilter = 'slides';
          render();
          triggerSave();
          showToast(added + ' slides added from ' + deckName);
        }

        let added = 0;
        imageFiles.forEach((file, i) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const slideTime = Math.min(videoDuration, dropTime + i * 2);
            data.slides.push({ time: slideTime, title: file.name.replace(/\.[^.]+$/, ''), image: ev.target.result });
            added++;
            if (added === imageFiles.length) {
              data.slides.sort((a, b) => a.time - b.time);
              render();
              triggerSave();
              showToast(imageFiles.length === 1 ? 'Slide added from ' + file.name : imageFiles.length + ' slides added');
            }
          };
          reader.readAsDataURL(file);
        });
      });
    }

    // ===== RESIZE SYNC =====
    window.addEventListener('resize', () => {
      if (videoDuration > 0) {
        const oldPpsMin = ppsMin;
        ppsMin = computePpsMin();
        if (pixelsPerSecond <= oldPpsMin * 1.05) {
          zoomFit();
        } else {
          applyZoom(pixelsPerSecond);
        }
      }
    });

    // ===== INIT =====
    pushHistory();
    render();
    initExternalDrop();

    function revealApp() {
      document.body.classList.remove('is-loading');
      document.getElementById('pageLoader').classList.add('loaded');
    }

    let videoReady = false;
    let fontsReady = false;

    function checkAllReady() {
      if (videoReady && fontsReady) revealApp();
    }

    if (video.readyState >= 1) {
      videoReady = true;
    } else {
      video.addEventListener('loadedmetadata', () => { videoReady = true; checkAllReady(); }, { once: true });
    }

    document.fonts.ready.then(() => { fontsReady = true; checkAllReady(); });

    checkAllReady();

    // Failsafe — reveal after 5s regardless
    setTimeout(revealApp, 5000);
  </script>
</body>
</html>
